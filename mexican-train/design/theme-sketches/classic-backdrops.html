<!doctype html><meta charset=utf-8><style>
*{box-sizing:border-box;margin:0}
body{background:#111;font-family:Georgia,serif;color:#f5ecd0;padding:18px;display:grid;grid-template-columns:repeat(3,390px);gap:18px}
.card{width:390px;height:700px;position:relative;overflow:hidden;border-radius:14px}
.cap{position:absolute;left:0;right:0;top:0;z-index:20;padding:8px 12px;font:700 15px system-ui;background:rgba(0,0,0,.65);color:#fff}
.bar{position:absolute;top:36px;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:5;font-weight:700;font-size:20px;background:rgba(0,0,0,.35)}
.rows{position:absolute;top:96px;left:0;right:0;z-index:5}
.row{height:104px;display:grid;grid-template-columns:110px 1fr;align-items:center;border-bottom:1px solid rgba(255,255,255,.14)}
.row b{text-align:center;font-size:17px;padding:0 6px}
.tiles{display:flex;gap:6px}
.t{width:70px;height:36px;border-radius:6px;background:linear-gradient(#fbf5df,#e9dcb4);border:1px solid #8a7a50;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 2px 3px rgba(0,0,0,.5);position:relative}
.t::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:1px;background:#8a7a50}
.t i{background:radial-gradient(circle,#222 0 3px,transparent 3.5px) 30% 30%/50% 50%,radial-gradient(circle,#222 0 3px,transparent 3.5px) 70% 70%/50% 50%}
.tray{position:absolute;left:10px;right:10px;bottom:12px;height:150px;border-radius:12px;background:rgba(80,50,28,.5);z-index:5;padding:10px;font-weight:700}
.tray .tiles{margin-top:10px;flex-wrap:wrap}
.tray .t{width:70px}
.bg{position:absolute;inset:0}
/* 1 railroad at dusk */
.c1 .bg{background:linear-gradient(#2a1d4a,#a8432e 38%,#f0a050 52%,#2b3a2c 52%,#1d2a20)}
.c1 .bg::before{content:"";position:absolute;left:0;right:0;top:44%;height:60px;background:linear-gradient(#5a2d28,#5a2d28) 0 100%/100% 14px no-repeat,conic-gradient(from 0deg at 8% 100%,#3a1c1c 0 8deg,transparent 8deg 352deg,#3a1c1c 352deg);opacity:.8}
.c1 .rail{position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#4a2f1c 0 26px,transparent 26px 40px);opacity:.55}
.c1 .rail::after{content:"";position:absolute;left:0;right:0;top:3px;height:4px;background:#9aa0a6;box-shadow:0 5px 0 #9aa0a6}
/* 2 desert */
.c2 .bg{background:linear-gradient(#f6b26b,#f9d98a 32%,#e07a4f 32.2%,#c55a3a 48%,#8a3b26)}
.c2 .bg::before{content:"";position:absolute;left:0;right:0;top:15%;height:17%;background:linear-gradient(135deg,transparent 0 20%,#a8472c 20% 32%,transparent 32%) 0 0/110px 100%,linear-gradient(225deg,transparent 0 24%,#8f3b24 24% 34%,transparent 34%) 40px 0/140px 100%;opacity:.9}
.c2 .sun{position:absolute;left:150px;top:44px;width:90px;height:90px;border-radius:50%;background:#fff1b8;box-shadow:0 0 60px 20px rgba(255,230,150,.7)}
.c2 .cactus{position:absolute;top:92px;width:16px;height:56px;border-radius:8px;background:#2f5d3a}
.c2 .cactus::before,.c2 .cactus::after{content:"";position:absolute;width:10px;height:22px;border-radius:6px;background:#2f5d3a;top:14px}
.c2 .cactus::before{left:-12px}.c2 .cactus::after{right:-12px;top:22px}
.c2 .tray{background:rgba(60,28,16,.5)}
/* 3 papel picado */
.c3 .bg{background:radial-gradient(ellipse at 50% 0,#1f6f5c,#0f3f35 70%)}
.c3 .flags{position:absolute;top:0;left:0;right:0;height:120px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:34px}
.c3 .flags i{width:46px;height:62px;clip-path:polygon(0 0,100% 0,100% 85%,92% 100%,84% 85%,76% 100%,68% 85%,60% 100%,52% 85%,44% 100%,36% 85%,28% 100%,20% 85%,12% 100%,4% 85%,0 90%);opacity:.95;position:relative}
.c3 .flags i::after{content:"";position:absolute;inset:12px 10px;border-radius:50%;background:rgba(255,255,255,.35);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.c3 .string{position:absolute;top:36px;left:-10px;right:-10px;height:2px;background:#e8d9a0;transform:rotate(1.2deg)}
/* 4 talavera */
.c4 .bg{background:#f2efe6;background-image:radial-gradient(circle at 50% 50%,#1e4d9b 0 7px,transparent 8px),radial-gradient(circle at 0 0,transparent 0 22px,#2d63b5 23px 25px,transparent 26px),radial-gradient(circle at 100% 100%,transparent 0 22px,#2d63b5 23px 25px,transparent 26px),radial-gradient(circle at 100% 0,transparent 0 22px,#2d63b5 23px 25px,transparent 26px),radial-gradient(circle at 0 100%,transparent 0 22px,#2d63b5 23px 25px,transparent 26px);background-size:56px 56px}
.c4 .bg::after{content:"";position:absolute;inset:0;background:rgba(14,36,70,.78)}
/* 5 art deco station poster */
.c5 .bg{background:#7a1f25}
.c5 .bg::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 118%,#8b2630 0 5deg,#701b21 5deg 10deg)}
.c5 .bg::after{content:"";position:absolute;inset:10px;border:3px solid #d9b25f;box-shadow:inset 0 0 0 6px #7a1f25,inset 0 0 0 8px #d9b25f}
.c5 .bar{color:#f3d58a}
/* 6 cantina serape */
.c6 .bg{background:repeating-linear-gradient(90deg,#1a1410 0 18px,#d34a2a 18px 38px,#1a1410 38px 44px,#f0b429 44px 62px,#1a1410 62px 68px,#1f8a8a 68px 88px,#1a1410 88px 94px,#f3e7c9 94px 106px)}
.c6 .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(14,10,6,.72),rgba(14,10,6,.62))}
</style>
<div class="card c0"><div class=bg style="background:radial-gradient(ellipse at 50% 30%,#1d6a58,#0c3a31)"></div><div class=cap>Now: plain green felt</div></div>
<div class="card c1"><div class=bg></div><div class=cap>1 · Dusk on the railroad</div></div>
<div class="card c2"><div class=bg><div class=sun></div></div><div class=cap>2 · Desert sunset, mesas and cactus</div></div>
<div class="card c3"><div class=bg><div class=string></div><div class=flags id=fl></div></div><div class=cap>3 · Papel picado fiesta banners</div></div>
<div class="card c4"><div class=bg></div><div class=cap>4 · Talavera tile, dimmed</div></div>
<div class="card c5"><div class=bg></div><div class=cap>5 · Art-deco railway poster</div></div>
<div class="card c6"><div class=bg></div><div class=cap>6 · Cantina serape blanket</div></div>
<script>
const cols=['#e8467c','#f2b134','#2fb5a0','#7b5cd6','#ef6a3a','#4aa3e0','#e8467c'];
document.getElementById('fl').innerHTML=cols.map(c=>`<i style="background:${c}"></i>`).join('');
const tile=()=>'<div class=t><i></i><i></i></div>';
document.querySelectorAll('.card').forEach((c,k)=>{
  const n=[ ['Your train',5],['Jonah\'s train',4],['Mexican train',3]];
  c.insertAdjacentHTML('beforeend',`<div class=bar><span>Mexican Train</span><span>0 You &nbsp; 0 Jonah</span></div><div class=rows>${n.map(r=>`<div class=row><b>${r[0]}</b><div class=tiles>${tile().repeat(r[1]).slice(0)}</div></div>`).join('')}</div><div class=tray>Your hand<div class=tiles>${tile().repeat(8)}</div></div>`);
  if(k==1){c.querySelector('.bg').insertAdjacentHTML('beforeend','<div class=rail style="top:176px"></div><div class=rail style="top:280px"></div><div class=rail style="top:384px"></div>');}
  if(k==2){c.querySelector('.bg').insertAdjacentHTML('beforeend','<div class=cactus style="left:40px"></div><div class=cactus style="left:300px;height:44px"></div>');}
});
</script>
