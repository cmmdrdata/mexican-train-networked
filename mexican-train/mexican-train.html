    }
    function dragOver(trainId) {
      const next = trainId || null;
      if (S.dropTrain === next) return;
      S.dropTrain = next;
      render();
    }
    function dropOnTrain(k, trainId, from) {
      S.dragKey = null; S.dragIndex = null; S.dropTrain = null; S.hoverKey = null;
      if (S.prevHandOrder !== undefined) { S.handOrder = S.prevHandOrder; S.handArranged = !!S.prevHandArranged; S.prevHandOrder = undefined; }
      const a = S.awaiting;
      const mv = a && (a.kind === 'move' || a.kind === 'build') && a.moves ? a.moves.find(m => key(m.tile) === k && m.trainId === trainId) : null;
      if (!mv) {                                      // not a legal place for it: it simply goes back to the hand
        if (!hintsOn(S) && a && (a.kind === 'move' || a.kind === 'build' || a.kind === 'draw')) S.notice = 'That tile cannot be played on that train.';
        render(); triedInvalid(); return;
      }
      S.notice = '';
      S.dropFrom = from ? { key: k, rect: from, shown: fx && fx.shownOf ? fx.shownOf(k) : null } : null;   // the tile flies from where it was let go
      S.selectedKey = null;
      a.resolve(a.kind === 'build' ? { type: 'play', move: mv } : mv);
    }
    function moveTile(k, delta) {                    // keyboard: Shift + arrow keys on a focused tile
      if (!S.game) return;
      const order = handKeys(), i = order.indexOf(k);
      if (i < 0) return;
      S.handOrder = moveToSlot(order, k, i + delta); S.handArranged = true;
      render();
    }

    // after the window changes size, keep every train showing its newest domino
    function snapTrains() {
      if (!root.querySelectorAll) return;
      root.querySelectorAll('.scroller').forEach(el => {
        el.scrollLeft = el.scrollWidth;
        if (el.classList && el.classList.toggle) el.classList.toggle('more-left', el.scrollLeft > 4);
      });
    }

    function toggleChat() {
      S.opts.chat = !S.opts.chat;
      saveOpts();
      if (S.online) { if (!S.opts.chat && S.comment && S.comment.kind === 'computer') S.comment = null; render(true); return; }   // online the computer's comments come from the server: this only hides them
      if (!S.opts.chat) { S.comment = null; S.pendingRating = null; clearChatTimers(); }
      else if (S.awaiting && (S.awaiting.kind === 'move' || S.awaiting.kind === 'draw' || S.awaiting.kind === 'build')) armSlow();
      render(true);
    }

    /* The menu opens to the left of its button; when the button is near the left edge (the header wrapped), slide the menu back inside the window. */
    function keepMenuOnScreen() {
      try {
        const m = root.querySelector && root.querySelector('.menu');
        if (!m || !m.getBoundingClientRect) return;
        const vw = (global.innerWidth || (document.documentElement && document.documentElement.clientWidth)) || 0;
        if (!vw) return;
        m.style.transform = '';
        const r = m.getBoundingClientRect();
        let dx = 0;
        if (r.left < 8) dx = 8 - r.left; else if (r.right > vw - 8) dx = vw - 8 - r.right;
        if (dx) m.style.transform = `translateX(${Math.round(dx)}px)`;
      } catch (e) { /* ignore */ }
    }
    function toggleSound() {
      S.opts.sound = !S.opts.sound;
      saveOpts();
      if (S.opts.sound) { sound.unlock(); sound.clack(); }   // a click so you can hear that it is back on
      render(true);
    }

    function dialogOk() {
      const a = S.awaiting;
      if (a && a.kind === 'modal') { cancelCount(); S.count = null; S.modal = null; a.resolve(); if (S.online) S.awaiting = null; }
    }

    function dispatch(a) {
      switch (a.type) {
        case 'startGame': return startGame(a);
        case 'selectTile': return selectTile(a.key, a.viaMouse);
        case 'rotateTile': return rotateTile(a.key);
        case 'playOn': return playOn(a.train);
        case 'draw': return draw();
        case 'autoBuild': return autoBuild();
        case 'undoTile': return undoTile();
        case 'endBuild': return endBuild();
        case 'dialogOk': return dialogOk();
        case 'openRules': S.menuOpen = false; S.overlay = 'rules'; return render(true);
        case 'openMoves': S.menuOpen = false; S.overlay = 'moves'; return render(true);
        case 'toggleMenu': S.menuOpen = !S.menuOpen; render(true); return keepMenuOnScreen();
        case 'closeMenu': if (S.menuOpen) { S.menuOpen = false; render(true); } return;
        case 'setView': { const v = VIEW_IDS.includes(a.key) ? a.key : 'auto'; S.opts.view = v; S.menuOpen = false; saveOpts(); render(true); if (S.game && measureHandColumns()) render(true); return snapTrains(); }
        case 'viewport': { const n = !!a.narrow; if (n !== S.narrow) { const before = viewMode(S); S.narrow = n; if (viewMode(S) !== before) { render(true); if (S.game && measureHandColumns()) render(true); snapTrains(); } } return; }
        case 'newGame': S.menuOpen = false; S.overlay = 'setup'; return render(true);
        case 'closeOverlay':
          if (S.menuOpen) { S.menuOpen = false; render(true); return; }
          if (S.overlay === 'online-host' || S.overlay === 'online-join') { if (S.online && S.online.phase === 'connecting') leaveOnline(true); S.overlay = 'setup'; render(true); return; }
          if (S.overlay === 'online-leave') { S.overlay = null; render(true); return; }
          if (S.overlay === 'history') { S.overlay = 'setup'; render(true); return; }
          if (S.overlay && (S.matchActive || S.overlay === 'rules')) { S.overlay = null; render(true); }
          return;
        case 'openHistory': return openHistory(a.key === 'refresh' ? undefined : null);
        case 'historyCount': return openHistory(Number(a.key));
        case 'openHost': return openOnlineDialog('online-host');
        case 'openJoin': return openOnlineDialog('online-join', a.code);
        case 'hostGame':                                     // (waits for the server's address if it has not arrived yet)
          if (S.hostInfo && S.hostInfo.state === 'ready') return beginOnline('create', a);
          return loadHostInfo().then(() => beginOnline('create', a));
        case 'joinGame': return beginOnline('join', a);
        case 'startOnline': if (S.online && S.online.host) netSend({ t: 'start' }); return;
        case 'sendChat': return sendChat(a.key);
        case 'sendText': return sendText(a.text);
        case 'toggleSay': S.sayOpen = !S.sayOpen; return render(true);
        case 'askLeave': S.menuOpen = false; S.overlay = 'online-leave'; return render(true);
        case 'confirmLeave': leaveOnline(false); S.overlay = 'setup'; return render(true);
        case 'playAgainOnline': if (S.online && !S.online.againSent && S.modal && S.modal.type === 'final') { S.online.againSent = true; netSend({ t: 'rematch' }); render(true); } return;
        case 'onlineBack': leaveOnline(true, !!(S.online && S.online.ended && S.online.ended.reason === 'replaced')); S.overlay = 'setup'; return render(true);
        case 'resumeOnline': return resumeOnline();
        case 'copied': S.copied = a.which === 'copyLink' ? 'link' : 'failed'; later(() => { S.copied = false; render(); }, a.which === 'copyLink' ? 2000 : 6000); return render();
        case 'selectQr': S.qrIndex = Math.max(0, Number(a.key) || 0); return render();
        case 'hoverTile': return hoverTile(a.key);
        case 'dragStart': return dragStart(a.key);
        case 'dragMove': return dragMove(a.index);
        case 'dragEnd': return dragEnd();
        case 'invalidTry': return triedInvalid();
        case 'dragOver': return dragOver(a.train);
        case 'dropOnTrain': return dropOnTrain(a.key, a.train, a.from);
        case 'moveTile': return moveTile(a.key, a.delta);
        case 'snapTrains': return snapTrains();
        case 'measureHand': if (S.game && measureHandColumns()) render(true); return;
        case 'toggleSound': return toggleSound();
        case 'toggleChat': return toggleChat();
        case 'netWake': return netWake(a);
        case 'netNote': return netEvent('note', String(a.what || ''));
        case 'netDebug': S.debugNet = true; return render(true);
        case 'copyNetLog': return copyNetLog();
        case 'setJoinVia': if (S.form) S.form.joinVia = JOIN_VIAS.includes(a.value) ? a.value : 'local'; return;                // (the Host screen's choice of how the other player joins: remembered, no redraw)
        case 'setNetHintsForm': if (S.form) S.form.allowHints = !!a.value; return;                  // (the Host screen's switch: remembered, no redraw)
        case 'toggleShowHints': S.showHints = S.showHints === false; S.hoverKey = null; S.notice = ''; return render(true);
        case 'setAllowHints': S.opts.allowHints = !!a.value; saveOpts(); S.hoverKey = null; S.notice = ''; return render();
        case 'toggleStyle': S.menuOpen = false; S.opts.style = S.opts.style === 'numbers' ? 'pips' : 'numbers'; saveOpts(); return render(true);
        case 'boot': return render(true);
        default: return undefined;
      }
    }

    return { dispatch, render, state: S, ui, controllers, sanitize, legalTrains };
  }

  /* ================================= BOOT ================================= */

  function boot() {
    const root = document.getElementById('app');
    let seed = null, joinCode = '';
    let debugNet = false;
    try { seed = new URLSearchParams(location.search).get('seed'); debugNet = /^(1|true|on)$/i.test(new URLSearchParams(location.search).get('debug') || ''); } catch (e) { /* ignore */ }
    try {                                              // a scanned QR code opens  http://host:port/?join=CODE
      const u = new URL(location.href);
      joinCode = u.searchParams.get('join') || '';
      if (joinCode) { u.searchParams.delete('join'); history.replaceState(null, '', u.pathname + u.search + u.hash); }   // so a reload does not open it again
    } catch (e) { /* ignore */ }
    const storage = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    };
    const reduced = !!(global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const sound = createSound(global.AudioContext || global.webkitAudioContext);
    const canFly = typeof Element !== 'undefined' && Element.prototype && 'animate' in Element.prototype;
    const fx = canFly ? createFx(root, document) : null;
    // Served by a game server (http://...)? Then that server is the default for hosting and joining.
    let defaultServer = '';
    try { if (location.protocol === 'http:' && location.host) defaultServer = location.host; } catch (e) { /* ignore */ }
    /* Where a person types to the other person. It lives OUTSIDE the page's redrawn area on purpose: the page is redrawn on every move
     * the other player makes, and a text box inside it would lose the words, the cursor (and, on a phone, the keyboard) in the
     * middle of a sentence. This one is made once and only shown or hidden. */
    let dock = null;
    try {                                               // (if the page cannot make it, the quick-phrase panel inside the page is used instead)
      if (!(document.createElement && document.body && document.body.appendChild)) throw new Error('no document');
      const box = document.createElement('div');
      box.id = 'say-dock'; box.className = 'say-dock'; box.hidden = true;
      box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Say something to the others at the table');
      box.innerHTML = `<form class="say-form" autocomplete="off"><input id="say-text" type="text" maxlength="${CHAT_MAX}" placeholder="Type a message, then press Enter" aria-label="Your message" autocomplete="off" autocapitalize="sentences" enterkeyhint="send"><button class="btn primary" type="submit">Send</button><button class="btn" type="button" data-dock="close">Close</button></form>`
        + `<div class="say-quick" role="group" aria-label="Quick phrases">${ONLINE_PHRASES.map((ph, i) => `<button class="btn say" type="button" data-phrase="${i}">${esc(ph)}</button>`).join('')}</div>`;
      document.body.appendChild(box);
      const input = box.querySelector('#say-text');
      dock = { sync(open) { const was = !box.hidden; box.hidden = !open; if (open && !was && input && input.focus) input.focus(); }, clear() { if (input) input.value = ''; } };
      box.addEventListener('submit', e => { e.preventDefault(); app.dispatch({ type: 'sendText', text: input ? input.value : '' }); });
      box.addEventListener('click', e => {
        const b = e.target && e.target.closest ? e.target.closest('button') : null;
        if (!b || !b.dataset) return;
        if (b.dataset.phrase !== undefined) app.dispatch({ type: 'sendChat', key: b.dataset.phrase });
        else if (b.dataset.dock === 'close') app.dispatch({ type: 'toggleSay' });
      });
      box.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); app.dispatch({ type: 'toggleSay' }); } });
    } catch (err) { dock = null; }
    const app = createApp({
      root, storage, reducedMotion: reduced, sound, fx, dock,
      WebSocket: global.WebSocket, defaultServer, build: global.MT_BUILD || '', fetch: global.fetch ? global.fetch.bind(global) : null,
      rng: seed !== null && seed !== '' ? mulberry32(Number(seed)) : Math.random,
    });

    const drag = createDrag(root, app, document);
    root.addEventListener('click', e => {
      if (drag.consumeClick()) return;                // the click that ends a drag is not a play
      const el = e.target.closest ? e.target.closest('[data-action]') : null;
      if (el) {
        const d = el.dataset;
        if (d.action === 'toggleAllowHints') {            // the main-screen switch: it changes at once (and is remembered), without redrawing the dialog under the player's hands
          const on = !(el.getAttribute && el.getAttribute('aria-pressed') === 'true');
          if (el.setAttribute) { el.setAttribute('aria-pressed', String(on)); el.textContent = 'Allow hints: ' + (on ? 'on' : 'off'); }
          app.dispatch({ type: 'setAllowHints', value: on });
          return;
        }
        if (d.action === 'toggleNetHintsForm') {          // the Host screen's switch: it changes at once, without redrawing the form under the player's hands
          const on = !(el.getAttribute && el.getAttribute('aria-pressed') === 'true');
          if (el.setAttribute) { el.setAttribute('aria-pressed', String(on)); el.textContent = 'Allow hints: ' + (on ? 'on' : 'off'); }
          app.dispatch({ type: 'setNetHintsForm', value: on });
          return;
        }
        if (d.action === 'startGame') {
          const val = id => { const n = root.querySelector(id); return n ? n.value : undefined; };
          app.dispatch({ type: 'startGame', rounds: val('#opt-rounds'), hand: val('#opt-hand'), level: val('#opt-level'), cpus: val('#opt-cpus'), level2: val('#opt-level2'), level3: val('#opt-level3'), theme: val('#opt-theme'), view: val('#opt-view') });
        } else if (d.action === 'hostGame' || d.action === 'joinGame') {
          const val = id => { const n = root.querySelector(id); return n ? n.value : undefined; };
          app.dispatch({ type: d.action, server: val('#net-server'), name: val('#net-name'), code: val('#net-code'), rounds: val('#net-rounds'), hand: val('#net-hand'), computer: val('#net-computer'), computer2: val('#net-computer2'), theme: val('#net-theme'), allowHints: !(app.state.form && app.state.form.allowHints === false),
            joinVia: (root.querySelector('input[name="net-via"]:checked') || {}).value, joinManual: val('#join-manual') });
        } else if (d.action === 'sendText') {                  // (the in-page box, used only when there is no separate one)
          const n = root.querySelector('#say-text');
          app.dispatch({ type: 'sendText', text: n ? n.value : '' });
        } else if (d.action === 'copyLink') {
          copyText(String(d.key || ''), { document, navigator: global.navigator }).then(done => app.dispatch({ type: 'copied', which: done ? 'copyLink' : 'failed' }));
        } else {
          if (d.action === 'selectTile' && e.detail === 2) app.dispatch({ type: 'rotateTile', key: d.key });        // the second click of a double-click (or double-tap)
          else app.dispatch({ type: d.action, key: d.key, train: d.train, viaMouse: d.action === 'selectTile' && e.detail > 0 });     // (detail is 0 for a click that came from the keyboard)
        }
        return;
      }
      // a tap on a train plays the picked-up tile there: on a glowing one with hints, on any train without
      const track = e.target.closest ? (e.target.closest('.track.target') || e.target.closest('.track')) : null;
      if (track && track.dataset) app.dispatch({ type: 'playOn', train: track.dataset.train });
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') app.dispatch({ type: 'closeOverlay' }); });
    if (debugNet) app.dispatch({ type: 'netDebug' });
    // The browser tells us when the page is hidden or the network changes: a phone that locks, or a tab sent to the background,
    // may have lost its connection, and a returning page should look at it at once rather than wait for the next check.
    let hiddenAt = null;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); app.dispatch({ type: 'netNote', what: 'the page was hidden' }); }
      else { const ms = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = null; app.dispatch({ type: 'netWake', why: 'the page is visible again', hiddenMs: ms }); }
    });
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('online', () => app.dispatch({ type: 'netWake', why: 'the network came back' }));
      window.addEventListener('offline', () => app.dispatch({ type: 'netNote', what: 'the browser says it is offline' }));
      window.addEventListener('pageshow', e => { if (e && e.persisted) app.dispatch({ type: 'netWake', why: 'the page was restored from the back/forward cache' }); });
    }
    root.addEventListener('change', e => {
      if (e.target && e.target.name === 'net-via') {                 // how the other player will join (Host screen)
        app.dispatch({ type: 'setJoinVia', value: e.target.value });
        const box = root.querySelector('#join-manual-box');
        if (box) box.hidden = e.target.value !== 'manual';
        if (e.target.value === 'manual') { const typed = root.querySelector('#join-manual'); if (typed && typed.focus) typed.focus(); }
        return;
      }
      const id = e.target && e.target.id;
      if (id === 'net-computer') {                       // a fourth player needs a third first
        const f4 = root.querySelector('#net-computer2');
        if (f4) f4.disabled = String(e.target.value) === 'none';
        return;
      }
      if (id === 'opt-cpus') {                           // the second computer's skill only matters with two computers
        const f = root.querySelector('#field-level2'), f3 = root.querySelector('#field-level3');
        if (f) f.hidden = String(e.target.value) === '1';
        if (f3) f3.hidden = String(e.target.value) !== '3';
        return;
      }
    });
    // Enter in a text box of the host/join form presses its main button
    root.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || !e.target || e.target.tagName !== 'INPUT' || !/^net-/.test(e.target.id || '')) return;
      const b = root.querySelector('[data-primary]');
      if (b && !b.disabled && b.click) { e.preventDefault(); b.click(); }
    });
    if (global.matchMedia) {          // a phone-sized screen (or one turned that way) switches Auto between Roomy and Compact
      const mq = global.matchMedia('(max-width: 640px)');
      const onChange = () => app.dispatch({ type: 'viewport', narrow: mq.matches });
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
    document.addEventListener('pointerdown', e => {       // a tap outside the menu closes it
      if (app.state.menuOpen && !(e.target && e.target.closest && e.target.closest('.menu-wrap'))) app.dispatch({ type: 'closeMenu' });
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.state.menuOpen) { e.stopPropagation(); app.dispatch({ type: 'closeMenu' }); } }, true);
    if (global.addEventListener) global.addEventListener('resize', () => { app.dispatch({ type: 'measureHand' }); app.dispatch({ type: 'snapTrains' }); });

    // Browsers only allow sound after a click, tap or key press: unlock it on the first one.
    ['pointerdown', 'click', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => sound.unlock(), true));

    // Hovering (or tabbing to) a playable hand tile shows where it could go.
    const tileKey = el => {
      const b = el && el.closest ? el.closest('.tile-btn') : null;
      return b && b.classList && b.classList.contains('playable') ? b.dataset.key : null;
    };
    root.addEventListener('mouseover', e => app.dispatch({ type: 'hoverTile', key: tileKey(e.target) }));
    root.addEventListener('mouseleave', () => app.dispatch({ type: 'hoverTile', key: null }));
    root.addEventListener('focusin', e => app.dispatch({ type: 'hoverTile', key: tileKey(e.target) }));
    root.addEventListener('focusout', () => app.dispatch({ type: 'hoverTile', key: null }));
    // double-click a tile in the hand: it turns around (some touch browsers send this and not a second click, so both are heard; the page counts it once)
    root.addEventListener('dblclick', e => {
      const b = e.target && e.target.closest ? e.target.closest('.hand .tile-btn') : null;
      if (b && b.dataset) { e.preventDefault(); app.dispatch({ type: 'rotateTile', key: b.dataset.key }); }
    });
    // keyboard alternative: R turns the focused tile around
    root.addEventListener('keydown', e => {
      if ((e.key !== 'r' && e.key !== 'R') || e.ctrlKey || e.metaKey || e.altKey) return;
      const b = e.target && e.target.closest ? e.target.closest('.hand .tile-btn') : null;
      if (!b) return;
      e.preventDefault();
      app.dispatch({ type: 'rotateTile', key: b.dataset.key });
    });
    // keyboard alternative to dragging: Shift + left/right arrow moves the focused tile
    root.addEventListener('keydown', e => {
      if (!e.shiftKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      const b = e.target && e.target.closest ? e.target.closest('.tile-btn') : null;
      if (!b) return;
      e.preventDefault();
      app.dispatch({ type: 'moveTile', key: b.dataset.key, delta: e.key === 'ArrowLeft' ? -1 : 1 });
    });

    app.dispatch({ type: 'boot' });
    if (joinCode) app.dispatch({ type: 'openJoin', code: joinCode });   // from a scanned link: the Join screen with the code filled in
    else app.dispatch({ type: 'resumeOnline' });                        // a page reload in the middle of an online game: go back to it
    global.MexicanTrainApp = app;
  }

  global.MexicanTrainGame = {
    Engine: {
      newRound, legalMoves, applyMove, undoLast, playTurn, drawAnyway, buildPhase, playRound, isBlocked, cpuChoose,
      cpuBuildAction, cpuChooseAsync, tilesNotSeen, chanceHolds, guessHiddenTiles, longestChain, longestFullChain, buildSteps, handPips, tilePips, mulberry32, shuffle, key, LEVELS, LEVEL_LABEL,
      moveValue, rateMove,
    },
    tileSVG, tileBackSVG, pipPoints, viewApp, createApp, pickCpuName, PIP_COLORS, PACE, CPU_NAMES, renderClack, clackGapMs, renderTurn, renderTick, COUNT_UP, createSound,
    flightGeometry, flightRotation, flightStart, moveInOrder, slotAt, dropIndexAt, createFx, createDrag, orderedHand,
    RATING, OWN_SHORT, WOBBLE, createRecorder, createRoundBuffer, recordingUi, LOG_HOOKS, CHAT, LINES, commentKindFor, pickLine, fillLine, composeComment, paceFor, soleTile, CPU_PLAYERS, levelOfName, NATIVE_LINES, NATIVE_LANG, nativeLangOf, FOOD, FOOD_ENGLISH, FOOD_NATIVE, foodComment,
    PLAYER_IDS, toyTrainSVG, ringSVG, THEMES, THEME_IDS, voiceOf, foodOf, trainColor, ONLINE_PHRASES, cleanChatText, CHAT_MAX, cleanPlayerName, faceLikeDots, parseServerAddress, parseJoinAddress, viewJoinChoices, joinList, copyText, qrEncode, qrSvg, qrCodewords, rsEncode, QR_BLOCKS_M, QR_TOTAL_CODEWORDS,
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
