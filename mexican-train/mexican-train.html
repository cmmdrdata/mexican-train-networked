          openShort: ['Only {built}. I saw {best} waiting for you.', 'A short road, though a longer one was there.', 'You held back what you could have given.'],
          openNone: ['No train at all. Even a small light is worth kindling.', 'You did not begin. The road waited in vain.'],
        },
        Elrond: {
          great: ['A wise move. There is hope for you yet.', 'Well chosen. I have seen ages of play, and that was good.', 'Even the elves would nod at that.'],
          good: ['A fair move.', 'Acceptable. Not remarkable.'],
          poor: ['I have seen this mistake before. Three thousand years ago.', 'Mortals always choose the easy path.', 'That move lacks foresight.'],
          awful: ['That is a blunder that will echo through the ages.', 'I have seen kingdoms fall over smaller errors.', 'You had a chance to be wise, and you threw it in the fire.'],
          missedOut: ['You could have ended it. The moment has passed, as moments do.', 'The win was yours. You turned away from it.'],
          slow1: ['Rivendell is patient. I am less so.', 'Choose. The council is waiting.'],
          slow2: ['I have held entire councils in less time.', 'The elves are sailing West. They may not wait for your move.'],
          slow3: ['I have lived through three ages. This turn feels like a fourth.', 'Even my patience has an end. You have found it.'],
          draw: ['Drawing again. The boneyard knows you well.', 'Nothing fits. That is a lesson in itself.'],
          pass: ['A pass. Your road is open to all.', 'You leave your train undefended. Unwise.'],
          doubleResent: ['A double, with nothing in my hand to meet it. I resent that, gently.', 'I must draw because of that double. A small injury, but I remember.'],
          ownDraw: ['Nothing fits. I have seen ages pass with less annoyance, but not many.', 'I must draw. A small thing, in the long view, and still irritating.', 'The tile I needed is absent. I will not complain. Much.'],
          ownDrawAgain: ['Wrong again. In three thousand years I have learned patience. It is thin today.', 'Another unfit tile. I begin to doubt the pile.'],
          ownBlocked: ['There is no move, and nothing left to draw. A closed door, then.', 'I must pass. Let the marker stand upon my train. It will not be forever.', 'Blocked. I confess I did not foresee it.'],
          invalid: ['That tile cannot be played there. Consider the numbers.', 'It does not match. Be patient, and look again.', 'An error of haste. The tile belongs elsewhere.'],
          ownShort: ['{built} tiles. A short train, and I counted on more.', 'My train is brief. A wise one makes the most of brief things.', 'A short train. It is a lesson in humility, and I did not ask for one.'],
          roundBlocked: ['No tile can move. A rare stillness. Count what remains.', 'The round is blocked. Even the long years have not made me love a stalemate.'],
          openBest: ['The longest train. That is wisdom.', 'Every tile placed. I am pleased.'],
          openShort: ['{built} tiles, when {best} were possible. A lack of vision.', 'A short train. You did not look far enough ahead.', 'You held back good tiles. Fear, perhaps.'],
          openNone: ['No train? Every quest must begin somewhere.', 'Nothing built. That is no way to set out.'],
        },
        Saruman: {
          great: ['Hm. Clever. Too clever, perhaps. I shall keep an eye on you.', 'A good move. I would have made it sooner.', 'You surprise me. I do not enjoy surprises.'],
          good: ['Adequate. For one of your kind.', 'A passable move. I expected nothing more.'],
          poor: ['How very predictable.', 'You play as though you have never studied the board.', 'A foolish choice. I welcome it.'],
          awful: ['Delightful. You are doing my work for me.', 'That move was a gift. I accept it graciously.', 'Did you consult a wizard? Clearly not.'],
          missedOut: ['You could have won. You did not. How satisfying.', 'The victory was yours, and you handed it to me. Wise of you.'],
          slow1: ['Come now. My patience is famously short.', 'Indecision. How very tiresome.'],
          slow2: ['I have built entire towers in less time.', 'Shall I make the choice for you? I would choose better.'],
          slow3: ['Your dithering is almost an art form.', 'I have seen seeing stones work faster than your mind.'],
          draw: ['Groping in the boneyard again? Pathetic.', 'Nothing fits. Of course it does not.'],
          pass: ['A pass. Your train is open to me. How generous.', 'You leave your road unguarded. I shall use it.'],
          doubleResent: ['A double?! And I must DRAW for it? Somebody will regret this.', 'That double sends me to the boneyard. Insolent. I shall remember it.'],
          ownDraw: ['Nothing fits. Outrageous. The tiles obey me no better than the Ents did.', 'I must draw? From a pile? Beneath me. Yet I will do it.', 'The wrong tile. Everything must be done by my own hand, it seems.'],
          ownDrawAgain: ['Wrong again! Someone has tampered with this pile. I shall find them.', 'Another worthless tile. I will remember this insult.'],
          ownBlocked: ['No move, no draw. A trap! And I did not make it.', 'I must pass. A marker on my train. You will pay for every inch of it.', 'Blocked! Do you know how long I planned this game?'],
          invalid: ['Foolish. That tile cannot go there, and you know it.', 'An illegal move. Do you take me for a fool?', 'Wrong train. How sadly typical.'],
          ownShort: ['{built} tiles. A short train, unworthy of me. I will not dwell on it.', 'My train is small. My plans are not.', 'A short train. Do not mistake it for weakness. It is a feint.'],
          roundBlocked: ['Blocked. Nobody wins. Do not look so pleased about it.', 'A stalemate. Everyone stuck, and I am the one who planned for it.'],
          openBest: ['The longest train. You must have been lucky.', 'Every tile placed. I suppose even you can count.'],
          openShort: ['Only {built}, when {best} was obvious? Disappointing.', 'A short train. Typical.', 'You left tiles in your hand. Saving them for me?'],
          openNone: ['No train at all. How very cautious. How very weak.', 'Nothing? I expected little, and you delivered less.'],
        },
      },
    },
  };
  const THEME_IDS = ['classic'].concat(Object.keys(THEMES));
  const THEME_LABEL = { classic: 'Classic' };
  Object.keys(THEMES).forEach(t => { THEME_LABEL[t] = THEMES[t].label; });
  const themeOf = id => THEMES[id] || null;
  // the theme of the game on screen: online, the host's choice (sent by the server); otherwise this player's setting
  const themeNow = S => (S.online ? (S.online.settings && S.online.settings.theme) || 'classic' : S.opts.theme);
  // a character's own lines (null for the classic players, who speak by level), and its home and food
  const voiceOf = (name, theme) => { const th = themeOf(theme); return (th && th.voices[name]) || null; };
  const foodOf = (name, theme) => { const th = themeOf(theme); return (th && th.food[name]) || FOOD[name] || null; };

  const CHAT = {
    chance: { great: 0.45, good: 0.3, poor: 0.8, awful: 1, missedOut: 1, draw: 0.2, pass: 0.35, openBest: 0.8, openShort: 1, openNone: 1,
      ownDraw: 0.3, ownDrawAgain: 0.6, doubleResent: 0.85, ownBlocked: 0.55, ownShort: 0.7, roundBlocked: 0.8, invalid: 0.7 },       // (the last five: the computer's own luck: it draws, it keeps drawing, it cannot move, its train is short, the round is blocked)
    cooldownMs: 7000,                                         // at least this long between ordinary comments
    bypass: { awful: true, missedOut: true, openShort: true, openNone: true, ownShort: true, roundBlocked: true },   // these always get through
    showMs: 6000,                                             // how long a speech bubble stays up
    reactDelayMs: [600, 1100],                                // a beat after your move before it reacts
    slowAfterMs: 25000,                                       // taking too long: the first jab...
    slowEveryMs: [20000, 26000],                              // ...and then another every 20-26 seconds, getting ruder
    nativeChance: 0.4,                                        // a player with a native language says this share of its comments in it
    foodChance: 0.4,                                          // a slow-player jab from a player with a home country is a hungry one this often
  };

  /* A random line of this kind that is not the one used last. */
  function pickLine(kind, rng, last, level, name, theme) {
    const voice = voiceOf(name, theme);                      // a themed character speaks in its own voice
    const pool = (voice && voice[kind]) || linesFor(level)[kind] || [];
    if (!pool.length) return '';
    const choices = pool.length > 1 ? pool.filter(l => l !== last) : pool;
    return choices[Math.min(choices.length - 1, Math.floor(rng() * choices.length))];
  }
  const fillLine = (text, vars) => String(text).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m))
    .replace(/\b1 tiles\b/g, '1 tile');                    // "you built 1 tile", not "1 tiles"

  /* What a computer player says: { text, lang?, trans?, dish? }. Shared by the game against the computer and the online
   * game (where the server says it). o: name, level, theme, rng, nativeChance, foodChance, last (the line said last, never
   * repeated) and dish (the dish already chosen during this wait). A slow-player jab may be a hungry one; any comment from a
   * player with a native language may be in it, with a translation; otherwise a line in the player's own voice. */
  function composeComment(kind, vars, o) {
    const rng = o.rng, name = o.name, slow = kind.indexOf('slow') === 0;
    const lang = nativeLangOf(name), pool = lang && NATIVE_LINES[lang][slow ? 'slow' : kind];
    const tier = slow ? Number(kind.slice(4)) : 0;
    const hungry = tier && foodOf(name, o.theme) && o.foodChance > 0 && rng() < o.foodChance
      ? foodComment(name, tier, rng, o.nativeChance, o.last, o.dish, o.theme) : null;
    if (hungry) return Object.assign({ text: hungry.text, dish: hungry.dish }, hungry.lang ? { lang: hungry.lang, trans: hungry.trans } : {});
    if (pool && pool.length && o.nativeChance > 0 && rng() < o.nativeChance) {
      const choices = pool.length > 1 ? pool.filter(p => p[0] !== o.last) : pool;
      const pair = choices[Math.min(choices.length - 1, Math.floor(rng() * choices.length))];
      return { text: pair[0], lang, trans: pair[1] };
    }
    return { text: fillLine(pickLine(kind, rng, o.last, o.level, name, o.theme), vars) };
  }

  /* ================================ VIEWS ================================= */

  const fmt = t => t[0] + '-' + t[1];
  const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const cpuName = S => S.cpuName || 'Computer';
  /* Who is at the table, in the order the screen shows them: you, then the opponent(s). Two players is the
   * usual game; three is an online game with a computer as the third player. */
  const tableIds = S => PLAYER_IDS.slice(0, S.game && Array.isArray(S.game.players) && (S.game.players.length === 3 || S.game.players.length === 4) ? S.game.players.length : 2);
  /* A player's train colour is the colour of their SEAT, so everybody sees the same colours: online, the host is always red,
   * the second person blue and the third seat yellow, on every screen (each screen only labels the players differently:
   * "you" is always at the bottom). Against the computer, you are red and it is blue. */
  const trainColor = (S, id) => { const n = S.seats && S.seats[id]; return Number.isInteger(n) && n >= 0 && n <= 3 ? n : Math.max(0, PLAYER_IDS.indexOf(id)); };
  /* The skill of each computer player: the first uses the "Computer skill" setting, the second (if there is one) its own. */
  const levelFor = (S, id) => (id === 'cpu3' ? S.opts.level3 : id === 'cpu2' ? S.opts.level2 : S.opts.level);
  const nameOf = (S, id) => (id === 'human' ? 'You' : id === 'cpu3' ? (S.cpu3Name || 'Computer') : id === 'cpu2' ? (S.cpu2Name || 'Computer') : cpuName(S));
  const listOf = a => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);

  function trainName(S, id) {
    return id === 'human' ? 'Your train' : id === 'cpu' ? `${cpuName(S)}'s train` : id === 'cpu2' || id === 'cpu3' ? `${nameOf(S, id)}'s train` : 'Mexican train';
  }

  function trainRef(S, id, actor) {
    if (id === 'mexican') return 'the Mexican train';
    if (id === actor) return actor === 'human' ? 'your train' : 'their own train';
    return actor === 'human' || id !== 'human' ? `${nameOf(S, id)}'s train` : 'your train';        // (one computer playing on the other's train: "Zed's train")
  }

  function bannerText(S) {
    const a = S.awaiting, g = S.game, hints = hintsOn(S);
    if (S.notice) return S.notice;                              // "that tile cannot go there", after a try with hints off
    if (a && a.kind === 'build') {
      const lead = S.drawnKey ? `You drew ${S.drawnKey}. ` : '';
      if (a.canDraw && hints) return 'Nothing fits the engine. Draw a tile from the boneyard.';
      if (a.lastDouble) return 'Your last tile is a double. A double cannot go out, so it stays in your hand. Press Done.';
      if (!a.canDone) return 'A double needs a tile on top of it. Cover it, or take it back.';
      if (a.placed === 0) return hints ? `${lead}Everyone builds their train at the same time. Tap tiles to add them, or let the game build your longest train.` : `${lead}Everyone builds their train at the same time. Pick a tile, then tap your train.`;
      return 'Keep adding tiles, take the last one back, or press Done. You can take tiles back until you press Done.';
    }
    if (!hints && a && (a.kind === 'move' || a.kind === 'draw')) {
      const lead = S.drawnKey ? `You drew ${S.drawnKey}. ` : '';
      if (S.selectedKey) return `Playing ${S.selectedKey}: tap the train to play it on.`;
      if (g.openDouble) return `${lead}A double is open: play a tile showing ${g.openDouble.value} on the outlined train.`;
      return `${lead}Your turn. Pick a tile, then the train to play it on.`;
    }
    if (a && a.kind === 'move') {
      if (S.selectedKey) return soleTile(a.moves) === S.selectedKey
        ? `${S.selectedKey} is the only tile you can play. Tap a glowing train.`
        : `Playing ${S.selectedKey}: tap a glowing train.`;
      const lead = S.drawnKey ? `You drew ${S.drawnKey}. ` : '';
      if (g.openDouble) {
        return `${lead}A double is open. Play a tile showing ${g.openDouble.value} on the glowing train.`;
      }
      return `${lead}Your turn. Pick a tile that glows.`;
    }
    if (a && a.kind === 'draw') {
      if (g.openDouble && g.players[0].hand.length === 0) return 'Your last tile was a double, and a double cannot go out. Draw a tile to try to cover it.';
      return 'Nothing fits. Draw a tile from the boneyard.';
    }
    if (g && g.opening && g.opening.human.finished) {
      const waiting = tableIds(S).filter(id => id !== 'human' && g.opening[id] && !g.opening[id].finished).map(id => nameOf(S, id));
      if (waiting.length) return `Your train is set. Waiting for ${waiting.join(' and ')} to finish building.`;
    }
    return S.banner || '';
  }

  function viewBar(S) {
    if (viewMode(S) !== 'roomy') return viewBarSmall(S);
    const g = S.game, on = S.online;
    const round = g
      ? `<div class="round"><span>Round ${S.roundIndex + 1} of ${on ? on.rounds : S.opts.rounds}</span><span>Engine double-${g.engine}</span>${on ? '<span>Online game</span>' : tableIds(S).length > 2 ? `<span>Computers: ${listOf(tableIds(S).slice(1).map(id => LEVEL_LABEL[levelFor(S, id)]))}</span>` : `<span>Computer: ${LEVEL_LABEL[S.opts.level]}</span>`}</div>`
      : '';
    return `<header class="bar">
      <div class="brand"><h1>Mexican Train</h1><p class="sub">${on ? (themeNow(S) === 'lotr' ? 'Double-12 online, in Middle-earth' : 'Double-12 online') : S.opts.theme === 'lotr' ? 'Double-12 in Middle-earth' : tableIds(S).length === 3 ? 'Double-12 against two computers' : tableIds(S).length === 4 ? 'Double-12 against three computers' : 'Double-12 against the computer'}</p></div>
      ${round}
      <div class="totals" role="group" aria-label="Scores, lowest wins">
        ${tableIds(S).map(id => `<div class="tot"><b>${S.totals[id] || 0}</b><span>${nameOf(S, id)}</span></div>`).join('\n        ')}
        <p class="hint">Lowest score wins</p>
      </div>
      <nav class="tools">
        <button class="btn" data-action="toggleSound" aria-pressed="${S.opts.sound ? 'false' : 'true'}" data-focus-id="tools-sound">${S.opts.sound ? 'Mute' : 'Unmute'}</button>
        <button class="btn" data-action="toggleStyle" data-focus-id="tools-style">${S.opts.style === 'numbers' ? 'Show pips' : 'Show numbers'}</button>
        <button class="btn" data-action="openRules" data-focus-id="tools-rules">Rules</button>
        ${on ? '<button class="btn" data-action="askLeave" data-focus-id="tools-new">Leave game</button>' : '<button class="btn" data-action="newGame" data-focus-id="tools-new">New game</button>'}
        <span class="menu-wrap"><button class="btn menu-btn" data-action="toggleMenu" aria-haspopup="menu" aria-expanded="${S.menuOpen ? 'true' : 'false'}" aria-label="Menu" data-focus-id="menu">&#8943;</button>${viewMenu(S, false)}</span>
      </nav>
    </header>`;
  }

  /* The ⋯ menu. In the Compact and Tiny views it holds the header buttons too; in Roomy only the history and the layout. */
  function viewMenu(S, full) {
    if (!S.menuOpen) return '';
    const g = S.game, on = S.online;
    const item = (action, text) => `<button class="btn" role="menuitem" data-action="${action}">${text}</button>`;
    return `<div class="menu" role="menu" aria-label="Menu">
        ${full ? item('toggleSound', S.opts.sound ? 'Mute' : 'Unmute') + item('toggleStyle', S.opts.style === 'numbers' ? 'Show pips' : 'Show numbers') + item('openRules', 'Rules') : ''}
        ${g ? item('openMoves', 'Game history') : ''}
        ${full ? (on ? item('askLeave', 'Leave game') : item('newGame', 'New game')) : ''}
        <div class="menu-views" role="group" aria-label="Layout"><span>Layout</span>${VIEW_IDS.map(v => `<button class="btn" role="menuitemradio" aria-checked="${S.opts.view === v ? 'true' : 'false'}" data-action="setView" data-key="${v}">${VIEW_LABEL[v]}</button>`).join('')}</div>
      </div>`;
  }

  /* The header in the Compact and Tiny views: the title and the scores on one line, and a "..." menu for the buttons, the history and the view. */
  function viewBarSmall(S) {
    const g = S.game, on = S.online, mode = viewMode(S);
    const names = tableIds(S);
    const oppText = on ? 'online' : names.length === 2 ? 'vs 1 computer' : 'vs ' + (names.length - 1) + ' computers';
    const round = g ? `<div class="round"><span>Round ${S.roundIndex + 1}/${on ? on.rounds : S.opts.rounds}</span><span>double-${g.engine}</span><span>${oppText}</span></div>` : '';
    const menu = viewMenu(S, true);
    return `<header class="bar small ${mode}">
      <div class="brand"><h1>Mexican Train</h1></div>
      <div class="totals" role="group" aria-label="Scores, lowest wins">
        ${names.map(id => `<div class="tot"><b>${S.totals[id] || 0}</b><span>${nameOf(S, id)}</span></div>`).join('\n        ')}
      </div>
      <nav class="tools menu-wrap"><button class="btn menu-btn" data-action="toggleMenu" aria-haspopup="menu" aria-expanded="${S.menuOpen ? 'true' : 'false'}" aria-label="Menu" data-focus-id="menu">&#8943;</button>${menu}</nav>
      ${round}
    </header>`;
  }

  function viewOpp(S) {
    const g = S.game;
    const a = S.awaiting;
    const ready = drawOnly(S) && hintsOn(S);               // flashes only when hints are on
    const clickable = ready || (!hintsOn(S) && !!a && (a.kind === 'move' || a.kind === 'build' || a.kind === 'draw'));   // with hints off you may try to draw on your turn
    const on = S.online;
    const c = on ? S.comment : (S.opts.chat ? S.comment : null);
    const ids = tableIds(S).slice(1);                       // the opponents: one, or two when a computer is the third player
    const rows = ids.map((id, i) => {
      const n = g.players.find(p => p.id === id).hand.length;
      const info = on && S.opps ? S.opps.find(o => o.id === id) : null;
      const who = on
        ? (info && info.computer
          ? `<span class="tag tag-${info.level}" title="${LEVEL_LABEL[info.level]} computer player">${LEVEL_LABEL[info.level]}</span>`
          : (() => { const pr = info && on.presenceBySeat && on.presenceBySeat[info.seat]; const up = pr ? pr.connected : on.oppConnected !== false; return `<span class="net-dot ${up ? 'up' : 'down'}" title="${up ? 'connected' : 'disconnected'}"></span>`; })())
        : `<span class="tag tag-${levelFor(S, id)}" title="${LEVEL_LABEL[levelFor(S, id)]} computer player">${LEVEL_LABEL[levelFor(S, id)]}</span>`;
      return `<div class="cpu-hand${i > 0 ? ' second' : ''}" data-player="${id}">
        <span class="who">${nameOf(S, id)}</span>
        ${who}
        <span class="backs" aria-hidden="true">${'<i class="back"></i>'.repeat(n)}</span>
        <span class="count">${n} ${n === 1 ? 'tile' : 'tiles'}</span>
      </div>`;
    }).join('\n      ');
    // The two switches live in one place that never moves (above the opponents' rows), not in a row that changes with names, tags and counts:
    // online, "Say something" (and Comments, when a computer is at the table); against the computer, Comments.
    const anyComputer = on ? !!(S.opps && S.opps.some(o => o.computer)) : true;
    const tools = (on ? `<button class="btn chat-toggle" data-action="toggleSay" aria-expanded="${S.sayOpen ? 'true' : 'false'}" data-focus-id="say">Say something</button>` : '')
      + (anyComputer ? `<button class="btn chat-toggle" data-action="toggleChat" aria-pressed="${S.opts.chat ? 'true' : 'false'}" data-focus-id="chat">Comments: ${S.opts.chat ? 'on' : 'off'}</button>` : '');
    const panel = on && S.sayOpen && !S.dockMode
      ? `<div class="say-panel" role="group" aria-label="Say something"><form class="say-form" data-say-form><input id="say-text" type="text" maxlength="${CHAT_MAX}" placeholder="Type a message" aria-label="Your message" autocomplete="off"><button type="button" class="btn primary" data-action="sendText">Send</button></form>${ONLINE_PHRASES.map((ph, i) => `<button class="btn say" data-action="sendChat" data-key="${i}">${esc(ph)}</button>`).join('')}</div>` : '';
    const mine = on && S.mySay ? `<div class="you-said${S.mySay.failed ? ' not-sent' : ''}">${S.mySay.failed ? '' : 'You said: '}${esc(S.mySay.text)}</div>` : '';
    const speaker = c && c.from ? c.from : cpuName(S);
    return `<section class="opp${ids.length > 2 ? ' four' : ids.length > 1 ? ' three' : ''}" aria-label="Opponent and boneyard">
      <div class="opp-tools">${tools}</div>
      ${rows}
      <button class="boneyard${ready ? ' ready' : ''}" data-action="draw" data-focus-id="draw"${ready ? ` style="animation-delay:-${S.flashPhase || 0}ms"` : clickable ? '' : ' disabled'}
        aria-label="${ready ? 'Draw a tile. ' : ''}${g.boneyard.length} tiles in the boneyard">
        <span class="stack" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="yard-text"><span class="count"><b>${g.boneyard.length}</b> in the boneyard</span>${ready ? '<span class="cta">Draw a tile</span>' : ''}</span>
      </button>
      <div class="bubble-slot" aria-live="polite">${!c ? '' : c.lang
        ? `<div class="bubble native"><b>${esc(speaker)}</b><span lang="${c.lang}"${NATIVE_DIR[c.lang] ? ' dir="rtl"' : ''}>${esc(c.text)}</span><small class="trans" lang="en">${esc(c.trans)}</small></div>`
        : `<div class="bubble"><b>${esc(speaker)}</b><span>${esc(c.text)}</span></div>`}${mine}${panel}</div>
    </section>`;
  }

  /* Hints: which tiles can be played and where is shown. They are off if the player turned "Allow hints" off on the
   * main screen, or has switched "Show hints" off on their hand (the button only exists when hints are allowed). */
  // Whether hints are allowed at all: in a game against the computer, this player's setting; in a hosted game, the host's choice,
  // for everyone at the table (each player may still switch their own hints off and on, if the host allows them).
  const allowHintsNow = S => (S.online ? !(S.online.settings && S.online.settings.allowHints === false) : S.opts.allowHints !== false);
  const hintsOn = S => allowHintsNow(S) && S.showHints !== false;
  function targetsOf(S) {
    const a = S.awaiting;
    const set = {};
    if (hintsOn(S) && a && a.kind === 'move' && S.selectedKey) {
      a.moves.forEach(m => { if (key(m.tile) === S.selectedKey) set[m.trainId] = m; });
    }
    return set;
  }

  // Trains the hovered (or keyboard-focused) hand tile could be played on.
  function previewOf(S) {
    const a = S.awaiting, set = {};
    if (hintsOn(S) && S.hoverKey && a && (a.kind === 'move' || a.kind === 'build')) {
      a.moves.forEach(m => { if (key(m.tile) === S.hoverKey) set[m.trainId] = true; });
    }
    return set;
  }

  // The one tile the player can play, if exactly one tile is playable (it may still fit on several trains).
  function soleTile(moves) {
    const keys = new Set((moves || []).map(m => key(m.tile)));
    return keys.size === 1 ? [...keys][0] : null;
  }

  // True when the only thing the player can do is draw a tile.
  function drawOnly(S) {
    const a = S.awaiting;
    return !!(a && (a.kind === 'draw' || (a.kind === 'build' && a.canDraw)));
  }

  /* The marker on an open train: a small, shiny, 3D-looking toy locomotive in the colour of its player, sitting at the far
   * left of their train. (The physical game has a coloured train piece for each player to show their train is open.)
   * It is one colour: every shade in it (the lighter top, the darker underside, the wheels, the window) comes from the
   * player's colour, and the only other thing is the white shine. The body comes down to the middle of the wheels, so
   * only the lower half of each shows. Pure SVG; the colours come from CSS (.c0 to .c3) and every gradient
   * has an id of its own. `color` is 0 to 3: the colour of a seat at the table (see trainColor). */
  function toyTrainSVG(color) {
    const g = n => `${n}-c${color}`;
    const edge = 'stroke="var(--tc-lo)" stroke-width="0.9" stroke-linejoin="round"';
    return `<span class="toy-train c${color}" aria-hidden="true"><svg viewBox="0 0 62 40" focusable="false">
      <defs>
        <linearGradient id="${g('tb')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tc-hi)"/><stop offset="0.4" style="stop-color:var(--tc)"/><stop offset="1" style="stop-color:var(--tc-lo)"/></linearGradient>
        <linearGradient id="${g('tr')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tc-hi)"/><stop offset="1" style="stop-color:var(--tc)"/></linearGradient>
        <linearGradient id="${g('tw')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tc)"/><stop offset="1" style="stop-color:var(--tc-dk)"/></linearGradient>
        <linearGradient id="${g('tg')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tc-lo)"/><stop offset="1" style="stop-color:var(--tc-dk)"/></linearGradient>
      </defs>
      <circle cx="14" cy="33" r="6.3" fill="url(#${g('tw')})" stroke="var(--tc-dk)" stroke-width="0.9"/>
      <circle cx="44" cy="33" r="6.3" fill="url(#${g('tw')})" stroke="var(--tc-dk)" stroke-width="0.9"/>
      <path d="M56 24 L61 33 L56 33 Z" fill="url(#${g('tb')})" ${edge}/>
      <path d="M42 14 v-7 l-2 -3 h10 l-2 3 v7 z" fill="url(#${g('tb')})" ${edge}/>
      <rect x="22" y="13" width="35" height="20" rx="5" fill="url(#${g('tb')})" ${edge}/>
      <path d="M30 13.3 a4.5 4.5 0 0 1 9 0 z" fill="url(#${g('tb')})" ${edge}/>
      <rect x="3" y="9" width="21" height="24" rx="2.5" fill="url(#${g('tb')})" ${edge}/>
      <rect x="1" y="4.5" width="25" height="5" rx="2.2" fill="url(#${g('tr')})" ${edge}/>
      <rect x="8" y="12" width="11" height="8" rx="1.8" fill="url(#${g('tg')})" stroke="var(--tc-dk)" stroke-width="0.8"/>
      <path d="M26 17.5 Q42 14.6 54 17.5" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M5 11.5 H21" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 14.2 H13.5" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M4.5 30.2 H55.5" fill="none" stroke="var(--tc-dk)" stroke-opacity="0.3" stroke-width="2.4" stroke-linecap="round"/>
    </svg></span>`;
  }

  /* The marker in the Lord of the Rings theme: a plain golden ring, seen a little from above, in place of the toy train.
   * It is gold for every player (the train it sits on says whose it is). The band is thicker at the front, the inside
   * of the back of the band shows through the middle, and it has a white shine and a soft glow (from CSS). */
  function ringSVG(color) {
    const g = n => `${n}-r${color}`;
    return `<span class="toy-train ring c${color}" aria-hidden="true"><svg viewBox="0 0 62 40" focusable="false">
      <defs>
        <linearGradient id="${g('gb')}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4b8"/><stop offset="0.35" stop-color="#f4c542"/><stop offset="0.7" stop-color="#c8901a"/><stop offset="1" stop-color="#7a5208"/></linearGradient>
        <linearGradient id="${g('gi')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5d0c"/><stop offset="1" stop-color="#e2ae3a"/></linearGradient>
      </defs>
      <path fill-rule="evenodd" fill="url(#${g('gb')})" stroke="#6b4705" stroke-width="0.8"
        d="M3 21 a28 17.5 0 1 0 56 0 a28 17.5 0 1 0 -56 0 Z M14 17.5 a17 8.5 0 1 0 34 0 a17 8.5 0 1 0 -34 0 Z"/>
      <path fill="url(#${g('gi')})" d="M14 17.5 A17 8.5 0 0 1 48 17.5 A17 5 0 0 0 14 17.5 Z"/>
      <path d="M8 25 Q18 35.5 34 35.5" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M45 7.5 Q53 9.5 56 14" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
    </svg></span>`;
  }

  function viewTrack(S, id) {
    const g = S.game, tr = g.trains[id];
    const targets = targetsOf(S);
    const target = !!targets[id];
    const must = !!(g.openDouble && g.openDouble.trainId === id);      // always shown, with or without hints: it is a rule of the game, not a hint
    const style = S.opts.style;
    // While the computer is still building, its tiles stay face down.
    const hidden = id !== 'human' && id !== 'mexican' && !!g.opening && !!g.opening[id] && !g.opening[id].finished;

    let note = '';
    if (id === 'mexican') note = `<span class="shared">Open to ${tableIds(S).length > 2 ? 'all players' : 'both players'}</span>`;
    else if (hidden) note = '<span class="shared">Building, tiles face down</span>';
    else if (tr.marker) {
      note = `<span class="lamp"><span>${id === 'human' ? `Open: ${tableIds(S).slice(1).map(x => nameOf(S, x)).join(' and ')} can play here` : 'Open: you can play here'}</span></span>`;
    }
    const label = `<div class="track-label">
        <div class="track-name">${trainName(S, id)}</div>
        <div class="track-info">${note}</div>
        ${must ? '<div class="cover">Cover the double here</div>' : ''}
      </div>`;

    const tiles = tr.tiles.map((t, i) => {
      const pop = S.lastPlay && S.lastPlay.trainId === id && S.lastPlay.index === i;
      if (hidden) return tileBackSVG(t[0] === t[1] ? 'v' : 'h', pop ? 'pop' : '', i);   // even face down, a double stands across the train
      const cls = [pop ? 'pop' : '', S.revealed === id ? 'reveal' : ''].join(' ').trim();
      return tileSVG(t[0], t[1], { style, cls, idx: i });
    }).join('');
    const engineTile = tileSVG(g.engine, g.engine, { style, cls: 'engine' });
    const ghost = target
      ? `<button class="ghost" data-action="playOn" data-train="${id}" data-focus-id="ghost-${id}"
           aria-label="Play ${S.selectedKey} on ${trainName(S, id).toLowerCase()}">
           ${tileSVG(targets[id].placed[0], targets[id].placed[1], { style })}<span>Play here</span></button>`
      : '';

    const preview = !target && !!previewOf(S)[id];
    const drop = S.dropTrain === id;
    const toy = id !== 'mexican' && !hidden && !!tr.marker;           // an open train wears its player's toy train
    return `<div class="track${target ? ' target' : ''}${must ? ' must' : ''}${preview ? ' preview' : ''}${drop ? ' drop' : ''}${toy ? ' has-toy' : ''}" data-train="${id}">
      ${label}
      <div class="rail">${toy ? (themeNow(S) === 'lotr' ? ringSVG(trainColor(S, id)) : toyTrainSVG(trainColor(S, id))) : ''}<div class="scroller" data-train="${id}"><div class="track-tiles">${engineTile}${tiles}${ghost}</div></div></div>
    </div>`;
  }

  function viewStatus(S) {
    const a = S.awaiting, g = S.game;
    let controls = '';
    if (a && a.kind === 'build') {
      const mine = g.trains.human.tiles;
      const lastT = mine[mine.length - 1];
      const n = a.buildCount;
      controls = '<div class="build">' +
        (a.canBuild && hintsOn(S) ? `<button class="btn primary" data-action="autoBuild" data-focus-id="autobuild">Build my longest train (${n} ${n === 1 ? 'tile' : 'tiles'})</button>` : '') +
        (a.canUndo && lastT ? `<button class="btn" data-action="undoTile" data-focus-id="undo">Take back ${fmt(lastT)}</button>` : '') +
        (a.canDone ? '<button class="btn" data-action="endBuild" data-focus-id="endbuild">Done</button>' : '') +
        '</div>';
    }
    return `<section class="status" role="status" aria-live="polite"><p class="msg">${bannerText(S)}</p>${controls}</section>`;
  }

  // The hand as a row of SLOTS. Playing a tile leaves its slot empty: nothing else moves. A tile drawn goes into the first empty slot (else
  // at the end), and a tile that is taken back goes back to the slot it came from. The layout is kept in S.handOrder: a tile's key, or null for
  // an empty slot; a hand seen for the first time is laid out heaviest first. Returns the slots, a tile or null for each.
  function handSlots(S) {
    const hand = S.game.players[0].hand;
    const byKey = {};
    hand.forEach(t => { byKey[key(t)] = t; });
    const dflt = hand.slice().sort((x, y) => (y[0] + y[1]) - (x[0] + x[1]) || y[0] - x[0]);
    if (!S.handOrder) S.slotMemory = {};                         // a hand not seen before: no slot is remembered
    const memory = S.slotMemory || (S.slotMemory = {});
    const seen = {};
    const slots = (S.handOrder || dflt.map(key)).map((k, i) => {
      if (k && byKey[k] && !seen[k]) { seen[k] = true; return k; }
      if (k && !byKey[k]) memory[k] = i;                         // it was played: its slot stays empty (and is remembered, in case it is taken back)
      return null;
    });
    dflt.forEach(t => {                                          // a tile with no slot: the one it left, else the first empty one, else a new one at the end
      const k = key(t);
      if (seen[k]) return;
      seen[k] = true;
      const old = memory[k];
      const at = old !== undefined && slots[old] === null ? old : slots.indexOf(null);
      if (at >= 0) slots[at] = k; else slots.push(k);
      delete memory[k];
    });
    S.handOrder = slots;
    return slots.map(k => (k ? byKey[k] : null));
  }
  const orderedHand = S => handSlots(S).filter(Boolean);        // just the tiles, in the order they lie

  /* Which way round each tile of the hand is DRAWN. A tile is stored as [a, b]; drawn as it is, a is its left half and b its right. When two tiles lie side
   * by side and have a number in common, one of them is drawn the other way round so that the like halves face each other (a 3|5 beside a 3|7 becomes 5|3 beside 3|7).
   * Only how it LOOKS: playing a tile does not depend on it. `flips` is how they were drawn last time (key -> true when drawn reversed): tiles are turned only
   * where that makes more halves face each other, and as few as possible, so a tile is not turned back just because its neighbour has gone. Returns the new flips. */
  function orientRun(tiles, flips, out, locked) {
    const pref = i => (flips[key(tiles[i])] && tiles[i][0] !== tiles[i][1] ? 1 : 0);
    const left = (t, o) => (o ? t[1] : t[0]), right = (t, o) => (o ? t[0] : t[1]);
    const opts = tiles.map((t, i) => (t[0] === t[1] ? [0] : (locked && locked[key(t)]) ? [pref(i)] : [0, 1]));      // (a double looks the same either way; a tile the player turned stays as they turned it)
    const better = (a, b) => !b || a.m > b.m || (a.m === b.m && (a.c < b.c || (a.c === b.c && a.z < b.z)));      // most facing pairs, then fewest tiles turned, then the stored way round
    let layer = {};
    opts[0].forEach(o => { layer[o] = { m: 0, c: o !== pref(0) ? 1 : 0, z: o, from: null }; });
    const layers = [layer];
    for (let i = 1; i < tiles.length; i++) {
      const next = {};
      opts[i].forEach(o => {
        opts[i - 1].forEach(q => {
          const prev = layers[i - 1][q];
          const cand = { m: prev.m + (right(tiles[i - 1], q) === left(tiles[i], o) ? 1 : 0), c: prev.c + (o !== pref(i) ? 1 : 0), z: prev.z + o, from: q };
          if (better(cand, next[o])) next[o] = cand;
        });
      });
      layers.push(next);
    }
    let o = null;
    Object.keys(layers[tiles.length - 1]).forEach(k => { if (o === null || better(layers[tiles.length - 1][k], layers[tiles.length - 1][o])) o = k; });
    for (let i = tiles.length - 1; i >= 0; i--) { out[key(tiles[i])] = Number(o) === 1; o = layers[i][o].from; }
  }
  function faceLikeDots(slots, across, flips, locked) {
    const out = {};
    slots.forEach(t => { if (t) out[key(t)] = !!flips[key(t)] && t[0] !== t[1]; });
    across = Math.max(1, across | 0);
    for (let i = 0; i < slots.length;) {
      if (!slots[i]) { i++; continue; }
      let j = i;
      while (j + 1 < slots.length && slots[j + 1] && (j + 1) % across !== 0) j++;      // the tiles that lie side by side in this row, with no empty slot between
      if (j > i) orientRun(slots.slice(i, j + 1), flips, out, locked);
      i = j + 1;
    }
    return out;
  }
  /* Move a tile to another slot of the hand: into an empty slot, which leaves the slot it came from empty; or, onto a slot with a tile in it,
   * the two swap places. (A drag passes over the slots one at a time, so a long drag slides the tile along; nothing else is ever disturbed.) */
  function moveToSlot(slots, k, toIndex) {
    const from = slots.indexOf(k);
    if (from < 0) return slots.slice();
    const to = Math.max(0, Math.min(slots.length - 1, toIndex));
    const next = slots.slice();
    next[from] = slots[to];                                   // an empty slot, or the tile that was there
    next[to] = k;
    return next;
  }

  function viewTray(S) {
    const g = S.game, me = g.players[0];
    const a = S.awaiting;
    const hints = hintsOn(S);
    const moving = !!(a && (a.kind === 'move' || a.kind === 'build')) || drawOnly(S);
    const playable = {};
    if (moving && a.moves) a.moves.forEach(m => { playable[key(m.tile)] = true; });
    const style = S.opts.style;
    const slots = handSlots(S);
    const nominal = Math.min(10, Math.max(1, Math.ceil((slots.length + 1) / 2)));
    const across = S.handCols || nominal;                    // how many tiles really lie in a row (measured after drawing: the grid wraps to the width of the screen)
    S.handColsUsed = across;
    if (!S.dragKey) S.flips = faceLikeDots(slots, across, S.flips || {}, S.flipLocked || {});      // (not while a tile is being dragged about: they turn when it is let go)
    const flips = S.flips || {};
    // (Compact and Tiny leave out the empty slots after the last tile: fewer rows. Their places are still there, and a tile can still be dropped past the end.)
    let lastFull = slots.length - 1; while (lastFull >= 0 && !slots[lastFull]) lastFull--;
    const shownSlots = viewMode(S) === 'roomy' ? slots : slots.slice(0, lastFull + 1);
    const tiles = shownSlots.map(t => {
      if (!t) return '<div class="slot-empty hole" aria-hidden="true"></div>';        // a tile was played from here: the slot stays empty
      const k = key(t);
      const mode = moving ? (hints ? (playable[k] ? 'playable' : 'dim') : 'plain') : 'idle';   // with hints off nothing says which tiles can be played
      const sel = S.selectedKey === k;
      const rev = !!flips[k], l = rev ? t[1] : t[0], r = rev ? t[0] : t[1];      // as drawn: left half, right half
      const label = `${l} and ${r}${mode === 'playable' ? ', playable' : ''}${sel ? ', selected' : ''}`;
      // not "disabled": every tile can be dragged, and a click on one that cannot be played does nothing
      return `<button class="tile-btn ${mode}${sel ? ' selected' : ''}${S.freshKey === k ? ' fresh' : ''}${S.dragKey === k ? ' drag-src' : ''}"
        data-action="selectTile" data-key="${k}" data-focus-id="t${k}" aria-pressed="${sel}"
        aria-label="${label}"${mode === 'playable' || mode === 'plain' ? '' : ' aria-disabled="true"'}>${tileSVG(l, r, { orient: 'h', style })}</button>`;
    }).join('');
    const tip = S.roundIndex === 0 && !S.handArranged && viewMode(S) === 'roomy' ? '<span class="tip">Drag a tile onto a train to play it, or around your hand to rearrange. Double-click a tile to turn it around.</span>' : '';
    // only when hints are allowed (main screen): a switch to show or hide them during the game
    const hintBtn = allowHintsNow(S) ? `<button class="btn hints-toggle" data-action="toggleShowHints" aria-pressed="${hints ? 'true' : 'false'}" data-focus-id="hints">Show hints: ${hints ? 'on' : 'off'}</button>` : '';
    // Two or more rows: half the tiles (plus one spare spot) per row, at most 10 across. On a narrow
    // screen the grid simply wraps into more rows.
    const n = me.hand.length;
    const cols = nominal;                                    // (from the slots, not the tiles: the row does not re-wrap as tiles are played)
    const canDraw = drawOnly(S) && hints;                  // (with hints off, the boneyard is the only way to draw: no flashing spot)
    const myTurn = !!a && (a.kind === 'move' || a.kind === 'build' || a.kind === 'draw');
    const spot = canDraw
      ? `<button class="slot-draw" data-action="draw" data-focus-id="slotdraw" aria-label="Draw a tile from the boneyard"
          style="animation-delay:-${S.flashPhase || 0}ms"><span>Draw</span></button>`
      : !hints                                              // hints off: the Draw button is always there, but never flashes (and is not clickable when it is not your turn)
        ? `<button class="slot-draw calm" data-action="draw" data-focus-id="slotdraw" aria-label="Draw a tile from the boneyard"${myTurn ? '' : ' disabled'}><span>Draw</span></button>`
        : '<div class="slot-empty" aria-hidden="true"></div>';
    return `<section class="tray" aria-label="Your hand">
      <div class="tray-head"><span>Your hand</span>${tip}${hintBtn}<span class="count">${n} ${n === 1 ? 'tile' : 'tiles'}</span></div>
      <div class="hand${canDraw ? ' can-draw' : ''}"${canDraw ? ' data-action="draw"' : ''}><div class="hand-grid" style="--cols:${cols}">${tiles}${spot}</div></div>
    </section>`;
  }

  /* The game's history: every message of the game so far (not just the last few), the newest on top, the oldest further down, in a panel of a fixed size that
   * scrolls (and can be scrolled from the keyboard: it takes the focus). The start of each round is picked out. The most that is drawn is LOG_SHOWN lines. */
  const LOG_SHOWN = 600;
  function viewLog(S) {
    const lines = S.log.slice(-LOG_SHOWN).reverse();
    return `<section class="log" role="region" tabindex="0" aria-label="Game history, newest first. Scroll to see earlier moves."><ol>${lines.map((l, i) => {
      const cls = (i === 0 ? 'latest ' : '') + (/^Round \d+:/.test(l) ? 'round' : '');
      return `<li${cls.trim() ? ` class="${cls.trim()}"` : ''}>${l}</li>`;
    }).join('')}</ol></section>`;
  }

  const RULES_HTML = `
    <ul class="rules">
      <li>Each round starts from the engine, a double: 12-12 in round 1, then 11-11, and so on down to 0-0. Your train, your opponent's train and the shared Mexican train all begin from that number.</li>
      <li>At the start of every round, all players build their own trains at the same time. Tap tiles to add them one after another, or press Build my longest train. You can take back your last tile as often as you like until you press Done. Your opponent's tiles stay face down until they finish.</li>
      <li>To play a tile, tap it and then tap the train, or drag it onto the train you want (the trains it can go on light up). You can also arrange your hand any way you like by dragging tiles around it, or with Shift plus the left and right arrow keys. Sort hand puts it back in order.</li>
      <li>If nothing in your hand fits the engine, draw one tile. If it still does not fit, you pass and a toy train marker goes on your train.</li>
      <li>Then you take turns. Play one tile that matches the number a train needs: your own train, the Mexican train, or your opponent's train when it has a toy train marker on it.</li>
      <li>Nothing fits? Draw one tile. If it fits, play it. If not, you pass and a marker goes on your train, which lets your opponent play there until you next play on it yourself.</li>
      <li>After you play a double, you must play another tile onto it straight away. If you can't, the next player has to cover it before anything else is played.</li>
      <li>Play your last tile to win the round and score 0, but not with a double: a double has to be covered. If your last tile is a double, you draw a tile and cover it to go out, or pass if it does not fit. In the opening, a double cannot be your last tile down.</li>
      <li>Otherwise you score the pips left in your hand (the 0-0 tile counts 50). A blocked round scores both players their pips. The lowest total wins.</li>
    </ul>`;

  function optionList(values, current, labeler) {
    return values.map(v => `<option value="${v}"${String(v) === String(current) ? ' selected' : ''}>${labeler(v)}</option>`).join('');
  }

  const aOrAn = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;                  // "an Easy", "an Expert", "a Medium", "a Hard"
  const LEVEL_TEXT = { easy: 'Easy: plays casually', normal: 'Medium: plays sensibly', hard: 'Hard: plans ahead and blocks you', expert: 'Expert: thinks several moves ahead' };

  function viewSetup(S) {
    const o = S.opts;
    return `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Mexican Train</h2>
      <p>Empty your hand before your opponent empties theirs. Play on your train, the shared Mexican train, or any train with a marker on it.</p>
      <div class="field"><label for="opt-rounds">Game length</label>
        <select id="opt-rounds">${optionList([1, 4, 13], o.rounds, v => v === 1 ? 'One round' : v === 4 ? 'Short game, 4 rounds' : 'Full game, 13 rounds')}</select></div>
      <div class="field"><label for="opt-hand">Tiles dealt to each player</label>
        <select id="opt-hand">${optionList([8, 12, 15], o.hand, v => v === 15 ? '15 (standard)' : String(v))}</select></div>
      <div class="field"><label for="opt-cpus">Computer players</label>
        <select id="opt-cpus">${optionList([1, 2, 3], o.cpus === 3 ? 3 : o.cpus === 2 ? 2 : 1, v => v === 1 ? 'One computer player' : v === 2 ? 'Two computer players' : 'Three computer players')}</select></div>
      <div class="field"><label for="opt-level">Computer skill</label>
        <select id="opt-level">${optionList(LEVELS, o.level, v => LEVEL_TEXT[v])}</select>
        <p class="field-note">Easy often plays at random and builds short trains. Hard plans ahead, keeps long chains available so it can go out sooner, and avoids leaving you a play when it can. Expert also thinks several moves ahead about what you might be holding (it does that when it plays one other player: with more than two players at the table it plays like Hard). Each level has its own computer players, who talk differently too.</p></div>
      <div class="field" id="field-level2"${o.cpus >= 2 ? '' : ' hidden'}><label for="opt-level2">Second computer's skill</label>
        <select id="opt-level2">${optionList(LEVELS, o.level2, v => LEVEL_TEXT[v])}</select>
        <p class="field-note">Each computer player has its own skill, so you can mix them: an easy one and a hard one, say.</p></div>
      <div class="field" id="field-level3"${o.cpus === 3 ? '' : ' hidden'}><label for="opt-level3">Third computer's skill</label>
        <select id="opt-level3">${optionList(LEVELS, o.level3, v => LEVEL_TEXT[v])}</select></div>
      <div class="field"><label for="opt-view">Layout</label>
        <select id="opt-view">${optionList(VIEW_IDS, o.view || 'auto', v => VIEW_LABEL[v])}</select>
        <p class="field-note">How much room the board takes. Auto is Compact on a phone, so the page fits without scrolling. Compact folds the buttons into a menu, the history and the instructions away. Tiny also makes the tiles smaller. Roomy is the full layout. You can change it later from the menu.</p></div>
      <div class="field"><label for="opt-theme">Theme</label>
        <select id="opt-theme">${optionList(THEME_IDS, o.theme || 'classic', v => THEME_LABEL[v])}</select>
        <p class="field-note">The Lord of the Rings: your opponents are characters from Middle-earth (Pippin and Gollum are Easy, Sam and Gimli Medium, Aragorn and Elrond Hard, Gandalf and Galadriel Expert), each talking in their own way, and an open train is marked with a golden ring instead of a toy train.</p></div>
      <div class="field"><label for="opt-hints">Hints</label>
        <button type="button" id="opt-hints" class="btn toggle" data-action="toggleAllowHints" aria-pressed="${o.allowHints !== false ? 'true' : 'false'}">Allow hints: ${o.allowHints !== false ? 'on' : 'off'}</button>
        <p class="field-note">On: the tiles you can play and the trains they can go on are highlighted, and your hand gets a Show hints button to switch that off or on. Off: nothing is highlighted and nothing is played for you: you pick the tile and then the train.</p></div>
      <details class="how"><summary>How to play</summary>${RULES_HTML}</details>
      <div class="actions">
        ${S.matchActive ? '<button class="btn" data-action="closeOverlay">Keep playing</button>' : ''}
        <button class="btn" data-action="openHistory">Recent games</button>
        <button class="btn" data-action="openHost">Host online game</button>
        <button class="btn" data-action="openJoin">Join online game</button>
        <button class="btn primary" data-action="startGame" data-primary="1">Start game</button>
      </div></div></div>`;
  }

  /* The games played on the server this page came from: who, when, who won, the final scores. */
  const HISTORY_COUNTS = [10, 25, 50, 100];
  function whenText(ms) {
    try { return new Date(ms).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return new Date(ms).toISOString().replace('T', ' ').slice(0, 16); }
  }
  function durationText(a, b) {
    const m = Math.round((b - a) / 60000);
    return a > 0 && b > a ? (m < 1 ? 'under a minute' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min') : '';
  }
  function viewHistory(S) {
    const h = S.history || { state: 'loading', games: [], n: 25 };
    const picker = `<div class="hist-count" role="group" aria-label="How many games to show"><span>Show the last</span>${HISTORY_COUNTS.map(n => `<button type="button" class="btn${h.n === n ? ' primary' : ''}" data-action="historyCount" data-key="${n}" aria-pressed="${h.n === n ? 'true' : 'false'}">${n}</button>`).join('')}</div>`;
    let body;
    if (h.state === 'loading') body = '<p class="hist-note">Loading...</p>';
    else if (h.state === 'unavailable') body = '<p class="hist-note">The list of games comes from the game server, and this page is not connected to one. Open the page from the server (the address node server.js shows) to see the games played on it.</p>';
    else if (!h.games.length) body = '<p class="hist-note">No games have been played on this server yet.</p>';
    else body = `<div class="hist-list">${h.games.map(g => {
      const stopped = g.result !== 'finished';
      const dur = durationText(g.startedAt, g.endedAt);
      const players = (g.players || []).map(p => `<li class="${p.winner ? 'won' : ''}"><span class="hn">${esc(p.name)}${p.computer ? ' <small>(computer' + (p.level ? ', ' + esc(p.level) : '') + ')</small>' : ''}${p.winner ? ' <b class="crown">Winner</b>' : ''}</span><span class="hs">${p.score}</span><span class="hr">${p.roundsWon} round${p.roundsWon === 1 ? '' : 's'} won</span></li>`).join('');
      return `<article class="hist-game${stopped ? ' stopped' : ''}"><header><time datetime="${new Date(g.endedAt).toISOString()}">${esc(whenText(g.endedAt))}</time><span>${stopped ? 'Stopped early' : 'Finished'} &middot; ${g.roundsPlayed} of ${g.rounds} rounds${dur ? ' &middot; ' + esc(dur) : ''}</span></header>
        <p class="hist-result">${stopped ? 'Scores when it stopped (lowest wins)' : (g.winners && g.winners.length > 1 ? 'Tied: ' + g.winners.map(esc).join(' and ') : esc((g.winners || [])[0] || '') + ' won')}</p><ul>${players}</ul></article>`;
    }).join('')}</div>`;
    return `<div class="overlay"><div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Recent games</h2>${picker}${body}
      <div class="actions"><button class="btn" data-action="openHistory" data-key="refresh">Refresh</button><button class="btn primary" data-action="closeOverlay" data-primary="1">Back</button></div>
    </div></div>`;
  }

  /* The game's history as a screen of its own (the Compact and Tiny views do not keep it under the board). */
  function viewMoves(S) {
    return `<div class="overlay"><div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Game history</h2>${viewLog(S)}
      <div class="actions"><button class="btn primary" data-action="closeOverlay" data-primary="1">Back to the game</button></div>
    </div></div>`;
  }

  function viewRules() {
    return `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">How to play</h2>${RULES_HTML}
      <div class="actions"><button class="btn primary" data-action="closeOverlay" data-primary="1">Back to the game</button></div>
    </div></div>`;
  }

  const sortedHand = hand => hand.slice().sort((x, y) => (y[0] + y[1]) - (x[0] + x[1]));
  /* The tiles left in a hand, biggest first. `shownCount` is how many have been put on the screen so far while the count is running (the rest take their place
   * but are not visible yet, so nothing moves); undefined shows them all. */
  function miniTiles(hand, style, shownCount) {
    if (!hand.length) return '<span class="none">No tiles left</span>';
    return sortedHand(hand).map((t, k) => `<span class="mt${shownCount !== undefined && k >= shownCount ? ' hid' : ''}">${tileSVG(t[0], t[1], { orient: 'h', style })}</span>`).join('');
  }

  /* The number to show for a total in the round-end or final dialog: how far the count has got (index i, the nth player of the dialog), or the real number when
   * nothing is counting. (The real number is also written, for a screen reader, in a visually hidden span: it should not hear the count.) */
  const countShown = (S, i, real) => (S.count && S.count.shown && S.count.shown[i] !== undefined ? S.count.shown[i] : real);

  function viewRoundEnd(S) {
    const m = S.modal;
    const cpu = cpuName(S);
    let title;
    if (m.blocked) title = m.winnerId ? (m.winnerId === 'human' ? 'Blocked, and you hold fewer pips' : `Blocked, and ${nameOf(S, m.winnerId)} holds fewer pips`) : 'Blocked, and it is a tie';
    else if (m.tie) title = tableIds(S).length === 2 ? 'You both played every tile' : 'More than one of you played every tile';
    else title = m.winnerId === 'human' ? 'You went out first' : `${nameOf(S, m.winnerId)} went out first`;
    const rows = m.rows.map((r, i) => `<div class="row">
        <div class="who">${r.name}</div>
        <div class="mini" data-mini="${i}">${miniTiles(r.hand, S.opts.style, S.count && S.count.rev ? S.count.rev[i] : undefined)}</div>
        <div class="pts"><b data-pips="${i}" aria-hidden="true">+${S.count && S.count.pipsShown ? S.count.pipsShown[i] : r.pips}</b><span class="sr-only">+${r.pips}</span><span>this round</span></div>
        <div class="pts"><b data-count="${i}" aria-hidden="true">${countShown(S, i, m.totals[r.id])}</b><span class="sr-only">${m.totals[r.id]}</span><span>total</span></div>
      </div>`).join('');
    return `<div class="overlay"><div class="dialog wide roundend" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">${title}</h2>
      <div class="rows">${rows}</div>
      <div class="actions"><button class="btn primary" data-action="dialogOk" data-primary="1">${m.last ? 'See final score' : 'Start round ' + (S.roundIndex + 2)}</button></div>
    </div></div>`;
  }

  function viewFinal(S) {
    const m = S.modal;
    const ids = tableIds(S), score = id => m.totals[id] || 0;
    const low = Math.min(...ids.map(score)), lows = ids.filter(id => score(id) === low);
    const title = lows.length === 1 ? (lows[0] === 'human' ? 'You win' : `${nameOf(S, lows[0])} wins`)
      : lows.length === ids.length ? 'A tie' : `A tie between ${lows.map(id => nameOf(S, id)).join(' and ')}`;
    const rivals = ids.slice(1).map(id => nameOf(S, id)).join(' and ');
    return `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">${title}</h2>
      <div class="final">${ids.map((id, i) => `<div class="tot"><b data-count="${i}" aria-hidden="true">${countShown(S, i, score(id))}</b><span class="sr-only">${score(id)} points,</span><span>${nameOf(S, id)}</span></div>`).join('')}</div>
      <p>Lowest score wins. ${S.online ? `You played ${rivals} online.` : tableIds(S).length > 2 ? `You played ${listOf(ids.slice(1).map(id => `${nameOf(S, id)} (${LEVEL_LABEL[levelFor(S, id)]})`))}.` : `You played ${cpuName(S)} on ${LEVEL_LABEL[S.opts.level]}.`}</p>
      ${S.online ? onlineAgainHTML(S) : '<div class="actions"><button class="btn primary" data-action="newGame" data-primary="1">Play again</button></div>'}
    </div></div>`;
  }
  /* Playing again, in a hosted game: anyone may ask once they have seen the final score, and the game starts when everyone has. The server says
   * who has asked and who has gone; this says it on the dialog, and offers the buttons that make sense. */
  function onlineAgainHTML(S) {
    const o = S.online, ag = o.again || { asked: [], gone: [] };
    const people = (S.opps || []).filter(x => !x.computer);                       // the other people (a computer player never needs asking)
    const said = list => list.length > 1 ? list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1] : list.join('');
    const asked = seat => (ag.asked || []).indexOf(seat) >= 0;
    const gone = people.filter(x => (ag.gone || []).indexOf(x.seat) >= 0).map(x => x.name);
    const asking = people.filter(x => asked(x.seat)).map(x => x.name), waiting = people.filter(x => !asked(x.seat)).map(x => x.name);
    const iAsked = !!o.againSent || asked(o.seat);
    const back = primary => `<button class="btn${primary ? ' primary' : ''}" data-action="onlineBack"${primary ? ' data-primary="1"' : ''}>Back to the menu</button>`;
    if (gone.length) return `<p role="status">${esc(said(gone))} ${gone.length > 1 ? 'have' : 'has'} left, so there is nobody to play again with.</p><div class="actions">${back(true)}</div>`;
    if (iAsked) return `<p role="status">${waiting.length ? `You would like to play again. Waiting for ${esc(said(waiting))}...` : 'Starting a new game...'}</p><div class="actions">${back(false)}<button class="btn primary" disabled>${waiting.length ? 'Waiting...' : 'Starting...'}</button></div>`;
    return `${asking.length ? `<p role="status">${esc(said(asking))} ${asking.length === 1 ? 'wants' : 'want'} to play again.</p>` : ''}<div class="actions">${back(false)}<button class="btn primary" data-action="playAgainOnline" data-primary="1">Play again</button></div>`;
  }

  /* Which dialog is showing, if any: the player's own choice first, then what the online game needs. */
  function overlayId(S) {
    if (S.overlay) return S.overlay;
    const o = S.online;
    if (o) {
      if (o.ended) return 'online-ended';
      if (o.phase === 'resuming' || o.conn !== 'open' || (o.phase === 'playing' && o.oppConnected === false)) return 'online-wait';
      if (o.phase === 'lobby') return 'online-lobby';
    }
    return (S.modal && S.modal.type) || null;
  }
  function viewOverlay(S) {
    switch (overlayId(S)) {
      case 'rules': return viewRules();
      case 'moves': return viewMoves(S);
      case 'history': return viewHistory(S);
      case 'setup': return viewSetup(S);
      case 'online-host': return viewOnlineForm(S, true);
      case 'online-join': return viewOnlineForm(S, false);
      case 'online-leave': return viewOnlineLeave(S);
      case 'online-ended': return viewOnlineEnded(S);
      case 'online-wait': return viewOnlineWait(S);
      case 'online-lobby': return viewOnlineLobby(S);
      case 'roundEnd': return viewRoundEnd(S);
      case 'final': return viewFinal(S);
      default: return '';
    }
  }

  /* ---- online dialogs ---- */
  const clock = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function viewOnlineForm(S, host) {
    const f = S.form || {}, busy = !!(S.online && S.online.phase === 'connecting');
    const err = S.onlineError ? `<p class="form-error" role="alert">${esc(S.onlineError)}</p>` : '';
    return `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">${host ? 'Host an online game' : 'Join an online game'}</h2>
      ${host
        ? `<p>This page must be opened from the game server on this computer (<code>node server.js</code>). You will get a join code to give to the others, with the address they join at (chosen below).</p>${pageBehind(S) ? '<p role="alert" class="notice"><b>This page is out of date: the game server now has a newer version. Reload this page (Ctrl+F5, or Cmd+Shift+R on a Mac), then host again.</b></p>' : ''}`
        : '<p>Ask the host for the server address and the join code.</p>'}
      ${host ? viewJoinChoices(S) : `<div class="field"><label for="net-server">Server address</label>
        <input id="net-server" type="text" value="${esc(f.server || '')}" placeholder="192.168.1.23:8080" autocomplete="off" spellcheck="false" autocapitalize="off"></div>`}
      ${host ? '' : `<div class="field"><label for="net-code">Join code</label>
        <input id="net-code" type="text" value="${esc(f.code || '')}" placeholder="ABC-DEF" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="12"></div>`}
      <div class="field"><label for="net-name">Your name</label>
        <input id="net-name" type="text" value="${esc(f.name || '')}" placeholder="${host ? 'Host' : 'Guest'}" autocomplete="nickname" maxlength="20"></div>
      ${host ? `<div class="field"><label for="net-rounds">Game length</label>
        <select id="net-rounds">${optionList([1, 4, 13], Number(f.rounds) || 4, v => v === 1 ? 'One round' : v === 4 ? 'Short game, 4 rounds' : 'Full game, 13 rounds')}</select></div>
      <div class="field"><label for="net-hand">Tiles dealt to each player</label>
        <select id="net-hand">${optionList([8, 12, 15], Number(f.hand) || 15, v => v === 15 ? '15 (standard)' : String(v))}</select></div>
      <div class="field"><label for="net-computer">Third player</label>
        <select id="net-computer">${(() => { const old = !!(S.hostInfo && S.hostInfo.state === 'ready' && S.hostInfo.maxHumans < 3); const o = optionList(['none'].concat(LEVELS, ['person']), old && f.computer === 'person' ? 'none' : f.computer || 'none', v => v === 'none' ? 'None' : v === 'person' ? 'Add a third person' : 'Add ' + aOrAn(LEVEL_LABEL[v]) + ' computer as a third player'); return old ? o.replace('<option value="person">Add a third person</option>', '<option value="person" disabled>Add a third person (this server must be restarted first)</option>') : o; })()}</select>
        <p class="field-note">With a computer player, all three are at the table from the start. (At a table of three the Expert plays like Hard: its looking ahead works against one other player.) With a third person, three people play, everyone joins with the same code, and the game starts when all three are in.${S.hostInfo && S.hostInfo.state === 'ready' && S.hostInfo.maxHumans < 3 ? ' <b>This game server is an older version and cannot seat a third person: stop it, start it again from the new files (<code>node server.js</code>), and reload this page.</b>' : ''}</p></div>
      <div class="field"><label for="net-computer2">Fourth player</label>
        <select id="net-computer2"${f.computer && f.computer !== 'none' ? '' : ' disabled'}>${(() => { const old = !!(S.hostInfo && S.hostInfo.state === 'ready' && !(S.hostInfo.maxPlayers >= 4)); const o = optionList(['none'].concat(LEVELS), old ? 'none' : f.computer2 || 'none', v => v === 'none' ? 'None' : 'Add ' + aOrAn(LEVEL_LABEL[v]) + ' computer as a fourth player'); return old ? o.replace(/<option value="(easy|normal|hard|expert)"/g, '<option disabled value="$1"') : o; })()}</select>
        <p class="field-note">Four players is the most a table can have. A fourth player is a computer: it joins a table of two people and a computer, or three people. Choose a third player first.${S.hostInfo && S.hostInfo.state === 'ready' && !(S.hostInfo.maxPlayers >= 4) ? ' <b>This game server is an older version and cannot seat four players: stop it, start it again from the new files (<code>node server.js</code>), and reload this page.</b>' : ''}</p></div>
      <div class="field"><label for="net-theme">Theme</label>
        <select id="net-theme">${optionList(THEME_IDS, THEME_IDS.includes(f.theme) ? f.theme : 'classic', v => THEME_LABEL[v])}</select>
        <p class="field-note">The Lord of the Rings: the computer player is a character from Middle-earth, and an open train is marked with a golden ring on everyone's screen.</p></div>
      <div class="field"><button type="button" id="net-hints" class="btn toggle" data-action="toggleNetHintsForm" aria-pressed="${f.allowHints !== false ? 'true' : 'false'}">Allow hints: ${f.allowHints !== false ? 'on' : 'off'}</button>
        <p class="field-note">Your choice applies to everyone at the table. On: the tiles that can be played are highlighted, and each player can switch that off or on for themselves. Off: no highlights and no "Build my longest train", for anyone.</p></div>` : ''}
      ${err}
      <div class="actions">
        <button class="btn" data-action="closeOverlay">Back</button>
        <button class="btn primary" data-action="${host ? 'hostGame' : 'joinGame'}" data-primary="1"${busy || (host && !(S.hostInfo && S.hostInfo.state === 'ready')) || (host && pageBehind(S)) ? ' disabled' : ''}>${busy ? 'Connecting...' : host ? 'Create game' : 'Join game'}</button>
      </div></div></div>`;
  }
  function viewOnlineLobby(S) {
    const o = S.online, host = o.host;
    const players = Array.from({ length: Math.max(2, o.settings.humans + (o.settings.computer ? 1 : 0) + (o.settings.computer2 ? 1 : 0)) }, (_, i) => i).map(i => {
      const p = o.players[i];
      return `<li class="${p ? (p.connected ? 'up' : 'down') : 'empty'}"><i class="net-dot ${p ? (p.connected ? 'up' : 'down') : ''}"></i><span>${p ? p.name + (i === o.seat ? ' (you)' : '') + (i === 0 ? ', host' : '') + (p.computer ? `, computer, ${LEVEL_LABEL[p.level || o.settings.computer]}` : '') : 'Waiting for a player...'}</span></li>`;
    }).join('');
    const list = host ? joinList(S) : [];
    const qi = Math.min(Math.max(0, S.qrIndex || 0), Math.max(0, list.length - 1));
    const shown = list[qi];
    const link = shown ? `http://${shown.addr}/?join=${o.code}` : '';
    const scanNote = !shown ? '' : shown.kind === 'public' ? `Scan with a phone to join over the internet. Your router must forward port ${esc(portOf(shown.addr))} to this computer.`
      : shown.kind === 'manual' ? 'Scan with a phone to join using the address you typed.' : 'Scan with a phone on the same network to join.';
    const qr = host && link
      ? `<div class="qrbox">${qrSvg(link, 'QR code: scan it to join the game')}
          <div class="qrtext"><p>${scanNote}</p><p class="field-note"><code>${esc(link)}</code></p>
          <button class="btn" data-action="copyLink" data-key="${esc(link)}">${S.copied === 'link' ? 'Copied' : S.copied === 'failed' ? 'Not copied: select the link above and copy it' : 'Copy link'}</button></div></div>` : '';
    const addrs = host
      ? (list.length
        ? `${qr}<p>${o.settings.humans === 3 ? 'Or the other players open' : 'Or the other player opens'} one of these addresses in a browser, or ${o.settings.humans === 3 ? 'enter it' : 'enters it'} under <b>Join online game</b>:</p><ul class="addrs">${list.map((x, i) => `<li><code>${esc(x.addr)}</code> <span class="field-note">${JOIN_KIND[x.kind]}</span>${list.length > 1 ? ` <button class="btn small" data-action="selectQr" data-key="${i}" aria-pressed="${i === qi ? 'true' : 'false'}">${i === qi ? 'QR shown' : 'Show QR'}</button>` : ''}</li>`).join('')}</ul>`
        : '<p>This server is only reachable from this computer (it was started with <code>--local-only</code>, or has no network address).</p>')
      : '';
    // Nothing to set on this screen: the game was set up on the Host screen, and now the host is only waiting for the other player to join.
    const summary = `${o.settings.rounds === 1 ? 'One round' : o.settings.rounds + ' rounds'}, ${o.settings.hand} tiles each${o.settings.computer && !o.settings.computer2 && o.settings.humans !== 3 ? `, with ${aOrAn(LEVEL_LABEL[o.settings.computer])} computer player` : `${o.settings.humans === 3 ? ', three people' : ', two people'}${o.settings.computer ? ` and ${aOrAn(LEVEL_LABEL[o.settings.computer])} computer player` : ''}${o.settings.computer2 ? ` and ${aOrAn(LEVEL_LABEL[o.settings.computer2])} computer player` : ''}`}${o.settings.theme && o.settings.theme !== 'classic' ? `, theme: ${THEME_LABEL[o.settings.theme]}` : ''}.`;
    const hintsNote = o.settings.allowHints === false ? (host ? 'Hints are off.' : 'Hints are off (the host\'s choice).') : (host ? 'Hints are allowed.' : 'Hints are allowed: you can switch them off for yourself in the game.');
    const settings = `<p>${summary} ${hintsNote}${host ? '' : ` ${o.players[0] ? o.players[0].name : 'The host'} will start the game.`}</p>`;
    return `<div class="overlay"><div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Online game</h2>
      <p>Join code</p>
      <div class="codebox"><span class="code-big" aria-label="Join code ${esc(o.display)}">${o.display}</span></div>
      ${addrs}
      <ul class="players">${players}</ul>
      ${settings}
      <div class="actions">
        <button class="btn" data-action="confirmLeave">Leave</button>
        ${host ? `<button class="btn primary" data-action="startOnline" data-primary="1"${o.canStart ? '' : ' disabled'}>${o.canStart ? 'Start game' : (o.settings.humans - o.players.filter(pl => pl && !pl.computer).length > 1 ? `Waiting for ${o.settings.humans - o.players.filter(pl => pl && !pl.computer).length} players...` : 'Waiting for a player...')}</button>` : ''}
      </div></div></div>`;
  }
  function viewOnlineWait(S) {
    const o = S.online;

  /* ================================== QR CODE ================================== */
  /* A small QR code generator with no dependencies: byte mode, versions 1 to 10, error correction

   * qrEncode(text) -> a square array of rows of booleans (true = dark), or null if it is too long.
   * qrSvg(text) -> an <svg> string with the 4-module quiet zone the scanners need. */

  // [error-correction codewords per block, blocks in group 1, data codewords each, blocks in group 2, data codewords each]

    6: [16, 4, 27, 0, 0], 7: [18, 4, 31, 0, 0], 8: [22, 2, 38, 2, 39], 9: [22, 3, 36, 2, 37], 10: [26, 4, 43, 1, 44],

  // arithmetic in GF(256) with the QR polynomial x^8 + x^4 + x^3 + x^2 + 1
  const GF_EXP = new Array(512), GF_LOG = new Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { GF_EXP[i] = x; GF_LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
    for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
  }());
  const gfMul = (a, b) => (a && b ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0);

  /* The Reed-Solomon error-correction codewords for a block of data codewords. */
  function rsEncode(data, ecLen) {
    let gen = [1];                                         // the product of (x + alpha^i), highest power first
    for (let i = 0; i < ecLen; i++) {
      const next = new Array(gen.length + 1).fill(0);
      for (let k = 0; k <= gen.length; k++) next[k] = (k < gen.length ? gen[k] : 0) ^ (k > 0 ? gfMul(gen[k - 1], GF_EXP[i]) : 0);
      gen = next;
    }
    const rem = new Array(ecLen).fill(0);
    for (const d of data) {
      const factor = d ^ rem.shift();

  function qrCodewords(bytes, version) {

    }

    let k = 0;
    const total = codewords.length * 8;
    for (let right = size - 1; right >= 1; right -= 2) {

        for (let j = 0; j < 2; j++) {
          const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;

        }

    }
    const MASKS = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
    ];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fixed[y][x] && MASKS[m](x, y)) dark[y][x] = !dark[y][x]; };

    const penalty = () => {
      let score = 0;
      const lines = [];
      for (let a = 0; a < size; a++) { lines.push(dark[a].slice()); lines.push(dark.map(row => row[a])); }
      for (const line of lines) {

        if (c === dark[y][x + 1] && c === dark[y + 1][x] && c === dark[y + 1][x + 1]) score += 3;

      if (sc < bestScore) { bestScore = sc; best = m; }

  /* ============================== ONLINE HELPERS ============================== */

  // Quick phrases instead of free chat: nothing a player types can reach the other screen.

  function parseServerAddress(raw) {

    /* ---------- the two players ---------- */
    async function humanAct(game, player, info) {
      // "Build my longest train" in progress: carry out its take-backs and plays one by one
      while (S.plan && S.plan.length) {
        const step = S.plan.shift();
        if (step.type === 'undo') {
          if (info.canUndo) { await pause(110); return { type: 'undo' }; }
        } else {
          const mv = info.moves.find(m => key(m.tile) === step.key);
          if (mv) { await pause(150); return { type: 'play', move: mv }; }
        }
        S.plan = null;   // something unexpected: hand control back to the player
      }
      const planDone = !!(S.plan && S.plan.length === 0);          // the plan ran to its end: the longest train is down
      S.plan = null;
      if (planDone && info.canDone) { await pause(450); return { type: 'done' }; }       // so the opening is finished too: there is no Done to press
      const chain = longestFullChain(game, player);
      return awaitUser('build', {
        moves: info.moves, placed: info.placed, canUndo: info.canUndo, canDraw: info.canDraw, canDrawEarly: !!info.canDrawEarly, canDone: info.canDone, lastDouble: !!info.lastDouble,
        canBuild: chain.length > (info.canDone ? info.placed : -1), buildCount: chain.length,
      });
    }

      const kind = action.type === 'done' ? 'finish' : action.type === 'draw' ? 'draw' : action.type === 'undo' ? 'undo' : second ? 'replace' : 'place';
      await pause(humanPace(kind));
      return action;
    }

    /* ---------- online play ---------- */

    /* ---------- the game log (see createRecorder) ----------
